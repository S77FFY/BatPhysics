  :root{
    --rock:#0b0e18; --rock2:#141a2c; --stone:#1d2740;
    --glow:#37e0c8; --glow2:#1aa89a; --amber:#ffb347; --crystal:#8a7bff;
    --bat-w:#dff4ff; --bat-k:#0e1626; --txt:#cfe6ff; --dim:#6a7ba0;
    --gold:#ffd34d; --bad:#ff5b6e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#05070d;
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:var(--txt);
    -webkit-user-select:none;user-select:none;touch-action:none;}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;background:#05070d;}

  /* overlay screens */
  .screen{position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 20px;
    background:radial-gradient(120% 90% at 50% -10%, #16213d 0%, #0a0e1a 60%, #05070d 100%);}
  .screen.on{display:flex;}
  .title{font-size:clamp(40px,9vw,84px);font-weight:800;letter-spacing:2px;
    color:var(--bat-w);text-shadow:0 0 24px var(--glow),0 0 4px #000;margin:0;}
  .title .b{color:var(--glow);}
  .sub{color:var(--dim);letter-spacing:3px;text-transform:uppercase;font-size:13px;margin:6px 0 26px;}
  .stat{display:flex;gap:28px;margin-bottom:30px;}
  .stat div{text-align:center;}
  .stat b{display:block;font-size:30px;color:var(--gold);text-shadow:0 0 12px #ffae0066;}
  .stat span{font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;}
  .btn{appearance:none;border:1px solid #2c3b5e;background:linear-gradient(180deg,#1a2440,#121a30);
    color:var(--txt);font:inherit;font-size:18px;font-weight:700;letter-spacing:1px;
    padding:15px 40px;border-radius:14px;margin:7px;cursor:pointer;min-width:230px;
    box-shadow:0 6px 0 #0a1020,0 8px 18px #0006;transition:transform .05s,box-shadow .05s;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0a1020;}
  .btn.primary{border-color:var(--glow2);
    background:linear-gradient(180deg,#14403c,#0c2724);color:#dffdf7;text-shadow:0 0 10px var(--glow);}
  .btn.sm{min-width:0;padding:11px 20px;font-size:15px;}
  .row{display:flex;flex-wrap:wrap;justify-content:center;}

  /* level select grid */
  /* level select: frozen header + scrollable list */
  #select{flex-direction:column;padding:0;}
  #select.on{display:flex;}
  .selhead{flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:max(12px,env(safe-area-inset-top)) 16px 12px;background:#070b14ee;
    border-bottom:1px solid #1d2740;backdrop-filter:blur(6px);z-index:5;}
  .seltotals{display:flex;gap:22px;align-items:baseline;}
  .seltotals>div{display:flex;flex-direction:column;align-items:center;}
  .seltotals b{font-size:22px;color:var(--gold);text-shadow:0 0 12px #ffae0044;line-height:1;}
  .seltotals span{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-top:3px;}
  .levlist{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:12px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;
    gap:10px;width:min(720px,100%);margin:0 auto;box-sizing:border-box;}
  .lrow{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:14px;
    border:1px solid #233055;background:linear-gradient(180deg,#141d36,#0d1528);cursor:pointer;}
  .lrow:active{transform:scale(.99);}
  .lrow.lock{opacity:.45;cursor:not-allowed;}
  .lrow .ln{font-size:20px;font-weight:800;color:var(--bat-w);min-width:34px;text-align:center;}
  .lrow .lmid{flex:1;display:flex;flex-direction:column;gap:3px;}
  .lrow .lnm{font-size:15px;color:var(--txt);letter-spacing:.3px;}
  .lrow .lbest{font-size:11px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;}
  .lrow .lstars{font-size:15px;letter-spacing:2px;color:var(--gold);white-space:nowrap;}
  .lrow.lock .lstars,.lrow.lock .lbest{visibility:hidden;}
  .lrow.lock::after{content:"\1F512";font-size:16px;opacity:.7;}
  /* white-hot stars: beat the verified reference score */
  .lstars.hot{color:#fff;text-shadow:0 0 8px #fff,0 0 16px #9ad7ff,0 0 24px #6cf;}
  .lrow.beat{border-color:#bfe8ff;box-shadow:0 0 14px #7fd0ff55,inset 0 0 18px #7fd0ff14;}

  /* in-game HUD */
  #hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;
    justify-content:space-between;pointer-events:none;
    padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px) 10px calc(env(safe-area-inset-left) + 14px);}
  #hud .pill{pointer-events:auto;background:#0c1326cc;border:1px solid #243152;border-radius:12px;
    padding:8px 12px;display:flex;align-items:center;gap:10px;backdrop-filter:blur(4px);}
  #scoreNum{font-size:26px;font-weight:800;color:var(--gold);min-width:74px;text-align:center;
    text-shadow:0 0 12px #ffae0055;}
  #lvlName{font-size:13px;letter-spacing:1px;color:var(--txt);}
  #lvlName small{color:var(--dim);display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;}
  .icbtn{pointer-events:auto;width:42px;height:42px;border-radius:11px;border:1px solid #243152;
    background:#0c1326cc;color:var(--txt);font-size:18px;cursor:pointer;display:flex;
    align-items:center;justify-content:center;}
  .icbtn:active{transform:scale(.93);}
  #toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);
    background:#0c1326e6;border:1px solid #2c3b5e;border-radius:12px;padding:10px 18px;
    font-size:14px;letter-spacing:.5px;color:var(--txt);opacity:0;transition:opacity .25s;
    max-width:80vw;text-align:center;pointer-events:none;}
  #toast.on{opacity:1;}
  /* tutorial tip card (shown on first appearance of a mechanic; dismissed on touch) */
  #tip{position:absolute;left:50%;top:84px;transform:translateX(-50%);
    display:none;z-index:20;pointer-events:none;max-width:74vw;}
  #tip.on{display:block;animation:tipIn .3s ease;}
  @keyframes tipIn{from{opacity:0;transform:translate(-50%,-8px);}to{opacity:1;transform:translateX(-50%);}}
  .tipinner{background:#0c1326f0;border:1px solid #37e0c8;border-radius:14px;
    padding:14px 20px;text-align:center;box-shadow:0 0 24px #37e0c844;}
  #tipText{font-size:15px;line-height:1.4;color:var(--txt);letter-spacing:.3px;}
  .tiphint{margin-top:8px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--glow);opacity:.8;}
  #fire{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);pointer-events:auto;}

  /* pause menu */
  #pause{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:#04060bd0;backdrop-filter:blur(3px);z-index:25;}
  #pause.on{display:flex;}
  .pausebox{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(440px,84vw);}
  .ptitle{margin:0 0 8px;font-size:30px;letter-spacing:6px;color:var(--gold);
    text-shadow:0 0 16px #ffae0066;}
  .pbtn{appearance:none;width:100%;border:1px solid #2c3b5e;
    background:linear-gradient(180deg,#1a2440,#121a30);color:var(--txt);font:inherit;
    font-size:19px;font-weight:700;letter-spacing:2px;padding:15px 20px;border-radius:14px;
    cursor:pointer;box-shadow:0 5px 0 #0a1020,0 8px 16px #0006;transition:transform .05s,box-shadow .05s;}
  .pbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #0a1020;}
  .pbtn.dim{opacity:.45;}

  /* rotate prompt */
  #rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:#05070d;z-index:60;}
  .rotinner{text-align:center;}
  .roticon{font-size:64px;color:var(--glow);animation:spin 2.4s linear infinite;
    text-shadow:0 0 20px var(--glow);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .rottext{margin-top:18px;font-size:22px;font-weight:700;color:var(--txt);letter-spacing:1px;}
  .rottext span{display:block;margin-top:8px;font-size:13px;font-weight:400;color:var(--dim);
    letter-spacing:2px;text-transform:uppercase;}

  /* result modal */
  #result{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:#04060bcc;backdrop-filter:blur(3px);z-index:20;}
  #result.on{display:flex;}
  .card{width:min(440px,90vw);background:linear-gradient(180deg,#16213d,#0c1426);
    border:1px solid #2c3b5e;border-radius:20px;padding:26px;text-align:center;
    box-shadow:0 20px 60px #000a;}
  .card h2{margin:0 0 4px;font-size:34px;letter-spacing:1px;}
  .card h2.win{color:var(--glow);text-shadow:0 0 18px var(--glow);}
  .card h2.lose{color:var(--bad);}
  .stars{font-size:46px;letter-spacing:8px;margin:8px 0 2px;height:50px;}
  .stars .f{color:var(--gold);text-shadow:0 0 14px #ffae00aa;}
  .stars .e{color:#2a3450;}
  .rscore{font-size:18px;color:var(--txt);margin:6px 0 18px;}
  .rscore b{color:var(--gold);font-size:24px;}
  .rscore .best{color:var(--dim);font-size:13px;display:block;margin-top:3px;}
  .hint{font-size:12px;color:var(--dim);margin-top:12px;line-height:1.5;}

  .tag{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:11px;
    letter-spacing:3px;color:var(--crystal);text-transform:uppercase;}
  .foot{position:absolute;bottom:14px;font-size:11px;color:var(--dim);letter-spacing:1px;}
  .ver{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:14px;
    font-family:'SF Mono','Consolas','Menlo','Courier New',monospace;
    font-size:11px;letter-spacing:1px;color:var(--dim);opacity:.8;}
  @media (max-width:520px){ .grid{grid-template-columns:repeat(4,1fr);} }
  #bdToggle{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 10px);transform:translateX(-50%);
    z-index:60;display:flex;gap:2px;padding:3px;border-radius:999px;border:1px solid rgba(227,173,98,.5);
    background:rgba(18,11,6,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font:600 13px/1 system-ui,-apple-system,sans-serif}
  #bdToggle span{padding:8px 14px;border-radius:999px;color:#cdb79a}
  #bdToggle span.on{background:#e3ad62;color:#1c1108}
  #bdToggle:focus-visible{outline:2px solid #a9d8ff;outline-offset:2px}
  /* ===== v2 type and surfaces: National Park throughout, warm glass over the caves ===== */
  :root{ --cream:#f4e8d2; --cream2:#ddcdb2; --mute:#ae9c82; --gold:#ffd166; --sonar:#7ff5df;
    --glass:rgba(14,10,7,.64); --edge:rgba(255,236,210,.16); --bad:#ff8f7d; }
  html,body{font-family:'National Park',system-ui,-apple-system,sans-serif;color:var(--cream);background:#060504;}
  canvas{background:#060504;}
  .screen{background:radial-gradient(120% 90% at 50% -10%, #2b1f15 0%, #120d09 58%, #070504 100%);}
  .ver{font-family:'National Park',system-ui,sans-serif;font-size:12px;letter-spacing:.03em;color:rgba(244,232,210,.42);opacity:1;
    font-variant-numeric:tabular-nums;left:calc(env(safe-area-inset-left) + 14px);}

  /* buttons */
  .btn{border:1px solid var(--edge);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    color:var(--cream);font-weight:700;font-size:18px;letter-spacing:.01em;padding:13px 28px;border-radius:999px;
    min-width:0;margin:6px;box-shadow:0 8px 24px rgba(0,0,0,.35);text-shadow:none;transition:transform .08s,box-shadow .08s,background .15s;}
  .btn:active{transform:scale(.96);box-shadow:0 3px 10px rgba(0,0,0,.35);}
  .btn.primary{background:linear-gradient(180deg,#ffdc8a,#f0b44e);border-color:#ffe7ab;color:#2b1904;text-shadow:none;
    box-shadow:0 10px 30px rgba(240,180,78,.25),inset 0 -2px 0 rgba(140,84,14,.35);}
  .btn.sm{padding:11px 22px;font-size:16px;}
  .btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--cream2);-webkit-backdrop-filter:none;backdrop-filter:none;}
  .btn.danger{background:rgba(120,32,22,.55);border-color:rgba(255,143,125,.45);color:#ffe2db;}
  .btn:focus-visible,.icbtn:focus-visible,.pbtn:focus-visible,.srow:focus-visible{outline:2px solid var(--sonar);outline-offset:3px;}

  /* title */
  #title{padding:0;background:#060607;overflow:hidden;}
  #titleCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0;}
  .tbtns{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + max(14px, 7.5vh));
    display:flex;justify-content:center;align-items:center;gap:12px;}
  .tbtns .btn{margin:0;font-size:19px;padding:13px 30px;}
  .tbtns .btn.primary{font-size:21px;padding:14px 50px;}
  .tgear{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 14px);}
  #title .ver{top:auto;bottom:calc(env(safe-area-inset-bottom) + 10px);}
  #title .tbtns,#title .tgear,#title .ver{opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .6s ease,transform .6s ease;}
  #title.ready .tbtns,#title.ready .tgear,#title.ready .ver{opacity:1;transform:none;pointer-events:auto;}
  #title.ready .tgear{transition-delay:.15s;}

  /* settings sheet on the title */
  #tsheet{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:30;
    background:rgba(5,4,3,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
  #tsheet.on{display:flex;}
  .tscard{width:min(400px,88vw);max-height:92vh;overflow:auto;padding:18px 18px 14px;border-radius:24px;text-align:center;
    background:linear-gradient(180deg,rgba(40,29,19,.95),rgba(18,13,9,.96));border:1px solid var(--edge);box-shadow:0 24px 70px rgba(0,0,0,.6);}
  .tscard h2{margin:2px 0 4px;font-size:22px;font-weight:700;letter-spacing:.01em;color:var(--cream);}
  .tscard p{margin:0 0 12px;font-size:14px;color:var(--mute);line-height:1.4;}
  .tsstat{font-variant-numeric:tabular-nums;}
  .tsstat b{color:var(--gold);font-weight:700;}
  .srow{appearance:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;margin:0 0 8px;
    padding:11px 16px;border-radius:14px;border:1px solid rgba(255,236,210,.1);background:rgba(255,236,210,.05);
    color:var(--cream);font:inherit;text-align:left;cursor:pointer;}
  .srow:active{background:rgba(255,236,210,.1);}
  .srow span{font-size:16px;font-weight:700;}
  .srow small{font-size:12.5px;color:var(--mute);}
  .srow.danger span{color:#ffb3a6;}
  .tscard .row{margin-top:2px;}

  /* in-game HUD */
  #hud .pill{background:var(--glass);border:1px solid var(--edge);border-radius:16px;padding:6px 14px;gap:10px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(0,0,0,.25);}
  #hud .scorepill{flex-direction:column;align-items:center;gap:0;padding:5px 16px 6px;}
  .scorepill small{font-size:10.5px;color:var(--mute);letter-spacing:.06em;line-height:1.1;}
  #scoreNum{font-weight:700;font-size:26px;line-height:1.02;color:var(--gold);min-width:3.2ch;
    text-shadow:0 0 14px rgba(255,190,80,.35);font-variant-numeric:tabular-nums;}
  #lvlName{font-size:16px;font-weight:700;letter-spacing:.01em;color:var(--cream);text-align:center;line-height:1.15;}
  #lvlName small{font-weight:400;font-size:11.5px;letter-spacing:.04em;text-transform:none;color:var(--mute);margin-bottom:1px;font-variant-numeric:tabular-nums;}
  .icbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);color:var(--cream);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:18px;}
  .icbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  #viewerBadge{color:var(--sonar);}
  #toast{top:calc(env(safe-area-inset-top) + 70px);background:var(--glass);border:1px solid var(--edge);border-radius:999px;
    padding:10px 20px;font-size:15px;letter-spacing:0;color:var(--cream);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  #tip{top:calc(env(safe-area-inset-top) + 74px);}
  .tipinner{background:rgba(14,10,7,.84);border:1px solid rgba(127,245,223,.42);border-radius:18px;padding:14px 22px 12px;
    box-shadow:0 0 30px rgba(127,245,223,.12),0 10px 30px rgba(0,0,0,.4);}
  #tipText{font-size:17px;line-height:1.38;color:var(--cream);letter-spacing:.005em;}
  #tipText b{color:var(--sonar);font-weight:700;}
  .tiphint{margin-top:7px;font-size:12.5px;letter-spacing:.02em;text-transform:none;color:var(--mute);opacity:1;}
  .tag{top:calc(env(safe-area-inset-top) + 64px);font-size:12px;letter-spacing:.06em;text-transform:none;color:var(--sonar);}

  /* result card */
  #result,#pause{background:rgba(6,4,3,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
  .card{width:min(460px,90vw);max-height:94vh;overflow:auto;background:linear-gradient(180deg,rgba(42,30,20,.94),rgba(18,13,9,.96));
    border:1px solid var(--edge);border-radius:26px;padding:20px 24px 16px;box-shadow:0 24px 70px rgba(0,0,0,.6);}
  .card h2{font-weight:700;font-size:32px;letter-spacing:.005em;margin:0;}
  .card h2.win{color:var(--cream);text-shadow:0 0 24px rgba(127,245,223,.45);}
  .card h2.lose{color:var(--bad);text-shadow:none;}
  .stars{font-size:42px;letter-spacing:6px;margin:4px 0 0;height:48px;}
  .stars .f{color:var(--gold);text-shadow:0 0 16px rgba(255,190,80,.55);}
  .stars .e{color:rgba(255,236,210,.14);}
  .rscore{font-size:16px;color:var(--cream2);margin:2px 0 12px;}
  .rscore b{font-size:30px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;margin-right:4px;}
  .rscore .best{color:var(--mute);font-size:13.5px;margin-top:2px;font-variant-numeric:tabular-nums;}
  .card .row{align-items:center;}
  .hint{font-size:13px;color:var(--mute);margin-top:8px;}

  /* pause */
  .ptitle{font-weight:700;font-size:30px;letter-spacing:.01em;color:var(--cream);text-shadow:none;margin:0 0 4px;}
  .pausebox{gap:10px;width:min(400px,84vw);}
  .pbtn{border:1px solid var(--edge);background:var(--glass);color:var(--cream);font-weight:700;font-size:18px;letter-spacing:.01em;
    padding:13px 20px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  .pbtn:active{transform:scale(.98);box-shadow:0 3px 10px rgba(0,0,0,.3);}
  .pbtn.primary{background:linear-gradient(180deg,#ffdc8a,#f0b44e);border-color:#ffe7ab;color:#2b1904;}

  /* level select */
  .selhead{background:rgba(10,7,5,.86);border-bottom:1px solid var(--edge);
    padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) 10px calc(env(safe-area-inset-left) + 16px);}
  .seltotals b{font-size:22px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:none;}
  .seltotals span{font-size:11.5px;letter-spacing:.03em;text-transform:none;color:var(--mute);margin-top:4px;}
  .levlist{padding-left:calc(env(safe-area-inset-left) + 16px);padding-right:calc(env(safe-area-inset-right) + 16px);}
  .lrow{border:1px solid rgba(255,236,210,.1);background:linear-gradient(180deg,rgba(44,31,21,.78),rgba(22,16,11,.78));border-radius:18px;padding:12px 18px;}
  .lrow .ln{font-weight:700;font-size:22px;color:var(--cream);font-variant-numeric:tabular-nums;min-width:40px;}
  .lrow .lnm{font-weight:700;font-size:16.5px;color:var(--cream);letter-spacing:0;}
  .lrow .lbest{font-size:13px;letter-spacing:0;text-transform:none;color:var(--mute);font-variant-numeric:tabular-nums;}
  .lrow .lstars{color:var(--gold);font-size:17px;}
  .lrow.beat{border-color:rgba(127,245,223,.5);box-shadow:0 0 14px rgba(127,245,223,.16),inset 0 0 18px rgba(127,245,223,.06);}
  .lstars.hot{color:#fff;text-shadow:0 0 8px #fff,0 0 16px rgba(127,245,223,.9);}

  /* rotate prompt */
  #rotate{background:#070504;}
  .roticon{color:var(--sonar);text-shadow:0 0 20px rgba(127,245,223,.6);}
  .rottext{font-weight:700;font-size:24px;letter-spacing:.01em;color:var(--cream);}
  .rottext span{font-weight:400;font-size:15px;letter-spacing:.01em;text-transform:none;color:var(--mute);}
  @media (min-height:640px){
    .tbtns{bottom:calc(env(safe-area-inset-bottom) + 11vh);gap:16px;}
    .tbtns .btn{font-size:22px;padding:16px 40px;}
    .tbtns .btn.primary{font-size:24px;padding:17px 64px;}
  }
  .selhead{align-self:stretch;justify-content:center;position:relative;}
  .selhead .icbtn{position:absolute;left:calc(env(safe-area-inset-left) + 16px);top:50%;margin-top:calc(env(safe-area-inset-top) / 2 - 22px);}
  @media (max-height:360px){
    .tscard{padding:12px 14px 10px;border-radius:20px;}
    .tscard h2{font-size:19px;margin:0 0 2px;}
    .tscard p{margin:0 0 8px;font-size:13px;}
    .srow{padding:8px 14px;margin-bottom:6px;}
    .srow span{font-size:15px;}
    .srow small{font-size:12px;}
    .tscard .btn.sm{padding:8px 20px;margin:2px 6px;}
    .pausebox{gap:7px;}
    .ptitle{font-size:24px;margin:0;}
    .pbtn{padding:9px 18px;font-size:16px;}
    .card{padding:14px 20px 12px;}
    .card h2{font-size:26px;}
    .stars{font-size:34px;height:40px;}
    .rscore{margin-bottom:8px;}
    .rscore b{font-size:26px;}
    #tip{max-width:62vw;}
    .tipinner{padding:10px 16px 9px;}
    #tipText{font-size:14.5px;}
  }
  .srow.tog{flex-direction:row;align-items:center;justify-content:space-between;}
  .sw{position:relative;flex:none;width:46px;height:26px;border-radius:13px;background:rgba(127,245,223,.85);transition:background .2s;}
  .sw::after{content:'';position:absolute;top:3px;left:23px;width:20px;height:20px;border-radius:50%;background:#14100c;transition:left .2s;}
  .srow.tog.off .sw{background:rgba(255,236,210,.18);}
  .srow.tog.off .sw::after{left:3px;background:var(--cream2);}
</style>
</head>
<body>
<div id="app"><canvas id="cv"></canvas></div>
<div id="saProbe" style="position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top);visibility:hidden;pointer-events:none"></div>

<!-- TITLE -->
<div id="title" class="screen on">
  <canvas id="titleCv" aria-hidden="true"></canvas>
  <h1 class="sr">Bat Physics</h1>
  <div class="tbtns">
    <button class="btn primary" onclick="UI.play()">Play</button>
    <button class="btn" onclick="UI.showSelect()">Levels</button>
  </div>
  <button class="icbtn tgear" onclick="UI.openSettings()" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  <div class="ver">v2.0.3</div>
  <div id="tsheet" role="dialog" aria-modal="true" aria-labelledby="tsHead">
    <div class="tscard">
      <div id="tsMain">
        <h2 id="tsHead">Settings</h2>
        <p class="tsstat" id="tsStat"></p>
        <button class="srow tog" id="musicRow" onclick="UI.toggleMusic()" role="switch" aria-checked="true"><span>Music</span><i class="sw" aria-hidden="true"></i></button>
        <button class="srow danger" onclick="UI.askReset()"><span>Reset progress</span><small>Clear all stars and scores</small></button>
        <div class="row"><button class="btn sm" onclick="UI.closeSettings()">Done</button></div>
      </div>
      <div id="tsConfirm" hidden>
        <h2>Erase all your stars and scores?</h2>
        <p>This can&rsquo;t be undone.</p>
        <div class="row"><button class="btn sm" onclick="UI.closeSettings()">Keep progress</button><button class="btn sm danger" onclick="UI.doReset()">Erase progress</button></div>
      </div>
    </div>
  </div>
</div>

<!-- LEVEL SELECT -->
<div id="select" class="screen">
  <div class="selhead">
    <button class="icbtn" onclick="UI.toTitle()" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="seltotals">
      <div><b id="tScore">0</b><span>Total score</span></div>
      <div><b id="tStars">0</b><span>Stars</span></div>
      <div><b id="tDone">0/100</b><span>Cleared</span></div>
    </div>
  </div>
  <div class="levlist" id="levlist"></div>
</div>

<!-- GAME -->
<div id="game" class="screen" style="background:none">
  <div id="hud">
    <div style="display:flex;gap:10px;align-items:center">
      <button class="icbtn" onclick="UI.quitToSelect()" aria-label="Levels"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="pill scorepill"><small>Score</small><span id="scoreNum">999</span></div>
    </div>
    <div class="pill" id="lvlName"></div>
    <div style="display:flex;gap:8px">
      <button class="icbtn" id="pauseBtn" onclick="UI.pause()" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
      <button class="icbtn" id="fsBtn" onclick="UI.toggleFullscreen()" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="icbtn" id="viewerBadge" style="display:none" onclick="UI.viewerSolve()" aria-label="Show solution">✦</button>
    </div>
  </div>
  <div id="toast"></div>
  <div id="tip"><div class="tipinner"><span id="tipText"></span><div class="tiphint">Tap to dismiss</div></div></div>
  <div id="result">
    <div class="card">
      <h2 id="rTitle" class="win">Level complete</h2>
      <div class="stars" id="rStars"></div>
      <div class="rscore" id="rScore"></div>
      <div class="row">
        <button class="btn sm ghost" onclick="UI.quitToSelect()">Levels</button>
        <button class="btn sm" id="rRetry" onclick="Game.retry()">Retry</button>
        <button class="btn sm primary" id="rNext" onclick="Game.next()">Next ›</button>
      </div>
      <div class="hint" id="rHint"></div>
    </div>
  </div>
  <div id="pause">
    <div class="pausebox">
      <h2 class="ptitle">Paused</h2>
      <button class="pbtn primary" onclick="UI.resume()">Resume</button>
      <button class="pbtn" onclick="UI.arrowsDefault()">Echos to default</button>
      <button class="pbtn" id="pbBest" onclick="UI.arrowsBest()">Echos to my best</button>
      <button class="pbtn" id="pbMusic" onclick="UI.toggleMusic()">Music: on</button>
      <button class="pbtn" onclick="UI.quitToSelect()">Quit</button>
    </div>
  </div>
  <div class="tag" id="viewerTag" style="display:none">Viewer mode</div>
</div>

<!-- rotate prompt (portrait) -->
<div id="rotate">
  <div class="ver" style="position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:14px">v2.0.3</div>

    <div class="roticon">⟳</div>
    <div class="rottext">Please rotate your device<br><span>Bat Physics plays in landscape</span></div>
  </div>
</div>

<script>
/* ============ embedded verified engine ============ */
// ============ BAT PHYSICS — core engine (environment-agnostic) ============
'use strict';
const BP = (() => {

const W = 1600, H = 900;
const DT = 1 / 120;
const GRAV = 1500;
const BALLR = 14;
const SEG_TH = 7;            // half-thickness of segment colliders
const ARROW_SPEED = 880;
const ECHO_BOOST = 1180;     // exit speed when accelerating through an echo
const ECHO_DECAY = 1400;     // px/s^2 the boost bleeds off back toward normal
const ARROW_R = 57;
const FLIP_SPEED = 860;
const FLIP_R = 78;
const FLIP_CD = 0.9;
const PORTAL_R = 30;
const WIN_R = 46;
const MAXV = 1600;
const TIME_CAP = 45;
const STALL_T = 1.1;
const SCORE_DIV = 12;

// clock hour -> unit direction (12 = up, 3 = right, 6 = down, 9 = left)
function hourDir(h) {
  const a = h * Math.PI / 6;
  return { x: Math.sin(a), y: -Math.cos(a) };
}

// ---------- geometry ----------
function closestOnSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const L2 = dx * dx + dy * dy;
  let t = L2 === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / L2;
  t = Math.max(0, Math.min(1, t));
  return { x: x1 + t * dx, y: y1 + t * dy };
}
function closestOnRect(px, py, r) {
  return { x: Math.max(r[0], Math.min(px, r[0] + r[2])),
           y: Math.max(r[1], Math.min(py, r[1] + r[3])) };
}

// ---------- moving floor (wave of vertical rods) ----------
// A band of `n` vertical rods. Rod k rises by 0..maxRise following a travelling
// wave: level = (k - t*speedRods) wrapped over `wavelen` rods, mapped 0..1..0.
// rodTop(k,t) returns the screen-y of the top of rod k (smaller y = higher).
function waveRise(wf, k, t) {
  const wavelen = wf.wavelen || 10;
  // phase advances one rod per (1/ wf.rodsPerSec) seconds; default 10 rods/sec so
  // the whole 10-rod pattern marches one rod every 0.1s (visibly a flowing wave).
  const rodsPerSec = wf.rodsPerSec || 10;
  let ph = ((k - t * rodsPerSec) % wavelen + wavelen) % wavelen; // 0..wavelen
  // triangle 0->max->0 across the wavelength gives a clean up/down wave
  const tri = ph < wavelen / 2 ? (ph / (wavelen / 2)) : (2 - ph / (wavelen / 2));
  return (wf.maxRise || 90) * tri;     // 0..maxRise pixels of rise
}

// ---------- vertical flip + recenter ----------
// Flip the whole level about y=450 (so floor->ceiling, bats hang down), then
// shift down so the playable band sits just above screen-center. Gravity is
// unchanged (still +y), so the ball falls away from the hanging bats.
const FLIP_SHIFT = 300;
function fy(y){ return (900 - y) + FLIP_SHIFT; }     // flip about 450, then shift down
function flipRect(r){ // [x,y,w,h] -> flip top edge becomes bottom
  return [r[0], fy(r[1] + r[3]), r[2], r[3]];
}
function flipLevel(level){
  if (level._flipped) return level._flipped;
  // Hand-authored levels already in flipped screen-space: use as-is (no transform,
  // no auto-terrain). The ball still spawns below the hanging bat (set in makeWorld).
  if (level.preFlipped) { level._flipped = level; return level; }
  const L = JSON.parse(JSON.stringify(level));
  L.black = { x: level.black.x, y: fy(level.black.y) };
  L.white = { x: level.white.x, y: fy(level.white.y) };
  if (level.launch) L.launch = { vx: level.launch.vx, vy: -(level.launch.vy||0) };
  L.rects = (level.rects||[]).map(flipRect);
  // Auto-terrain: the flip leaves open space below the hanging bats. Add a set of
  // staggered ledges/crags there so the falling ball has surfaces to land/roll on,
  // making the arc puzzles solvable. Levels can opt out with noAutoTerrain, or
  // add their own via level.crags (already-flipped coords) — but default gives a
  // gentle "cave floor" landscape under the action.
  if (!level.noAutoTerrain) {
    const baseY = 560;   // main catch-floor a bit below bat level (~406)
    // short landing ledges directly under each bat (at the ball's spawn/win height)
    // so a ball arriving near bat level can settle and roll in, like the original floor.
    const by = level.black.y, wy = level.white.y;   // pre-flip y
    const bfx = level.black.x, wfx = level.white.x;
    L.rects.push([bfx-150, fy(by)+30, 300, 22]);
    L.rects.push([wfx-150, fy(wy)+30, 300, 22]);
    // a broken, rocky main ledge with gaps lower down
    L.rects.push([60, baseY, 360, 30]);
    L.rects.push([520, baseY+60, 380, 30]);
    L.rects.push([1000, baseY, 360, 30]);
    L.rects.push([1420, baseY+50, 140, 30]);
    // hanging crags from the ceiling platform (stubby stalactites)
    L.rects.push([520, 380, 40, 130]);
    L.rects.push([960, 380, 40, 150]);
    // lower crags rising from deeper floor
    L.rects.push([700, baseY+150, 40, 120]);
    L.rects.push([1120, baseY+150, 40, 120]);
  }
  L.segs = (level.segs||[]).map(s => [s[0], fy(s[1]), s[2], fy(s[3])]);
  L.doors = (level.doors||[]).map(d => ({ ...d, y1: fy(d.y1), y2: fy(d.y2) }));
  L.buttons = (level.buttons||[]).map(b => ({ ...b, y: fy(b.y) }));
  L.flippers = (level.flippers||[]).map(f => ({ ...f, y: fy(f.y), h: (12 - f.h) % 12 }));
  L.portals = (level.portals||[]).map(p => ({ ...p, ay: fy(p.ay), by: fy(p.by) }));
  L.bouncy = (level.bouncy||[]).map(flipRect);
  L.cogs = (level.cogs||[]).map(c => ({ ...c, y: fy(c.y), spin: -(c.spin||1) }));
  L.windmills = (level.windmills||[]).map(m => ({ ...m, y: fy(m.y), dir: -(m.dir||1) }));
  // tools keep their angles but flipped vertically: hour h -> (12 - h) % 12
  const flipH = h => ((12 - h) % 12 + 12) % 12;
  if (level.tools) L.tools = level.tools.map(t => t.t==='osc'
    ? { t:'osc', h1:flipH(t.h1), h2:flipH(t.h2), period:t.period }
    : { t:'fix', h:flipH(t.h) });
  if (level.arrows) L.arrows = level.arrows.map(a => ({ ...a, h:flipH(a.h), y: fy(a.y) }));
  if (level.osc) L.osc = level.osc.map(a => ({ ...a, h1:flipH(a.h1), h2:flipH(a.h2), y: fy(a.y) }));
  if (level.drag) L.drag = level.drag.map(a => ({ ...a, h:flipH(a.h), y: fy(a.y) }));
  if (level.extraEchos) L.extraEchos = level.extraEchos; // count of solver-added echos
  L.id = level.id; L.name = level.name; L.ch = level.ch;
  level._flipped = L;
  return L;
}

// ---------- world instantiation ----------
// placements: array of {x,y} overriding drag-arrow positions (player or solution)
function makeWorld(level0, placements) {
  const level = flipLevel(level0);
  const w = {
    lvl: level,
    t: 0,
    p: { x: level.black.x, y: level.black.y + 26 },
    v: { x: level.launch ? level.launch.vx : 260, y: level.launch ? level.launch.vy : 0 },
    path: 0,
    pts: [{ x: level.black.x, y: level.black.y + 26 }],
    won: false, fail: null, done: false,
    spin: 0, boost: 0,
    stall: 0,
    arrows: [],          // unified arrow runtime list
    doorOpen: (level.doors || []).map(() => false),
    doorTimer: (level.doors || []).map(() => -1),
    flipCd: (level.flippers || []).map(() => 0),
    flipAnim: (level.flippers || []).map(() => 0),
    portalCd: (level.portals || []).map(() => 0),
    warpN: (level.portals || []).map(() => 0),
    btnDown: (level.buttons || []).map(() => false),
    wmAng: (level.windmills || []).map(m => m.ang0 || 0),   // current blade angle
    wmVel: (level.windmills || []).map(() => 0),            // angular velocity (free-spin)
    events: [],          // for renderer: {t, kind, i}
  };
  // Unified arrow model: every arrow is positioned by the player (placements[]).
  // Tools come from level.tools, or are assembled from legacy arrays (arrows/osc/drag).
  // All are draggable; oscillators sweep continuously off absolute time.
  let tools = level.tools;
  if (!tools) {
    tools = [];
    (level.arrows || []).forEach(a => tools.push({ t: 'fix', h: a.h }));
    (level.osc || []).forEach(a => tools.push({ t: 'osc', h1: a.h1, h2: a.h2, period: a.period || 2.4 }));
    (level.drag || []).forEach(a => tools.push({ t: 'fix', h: a.h }));
  } else {
    tools = tools.slice();
  }
  // extra echos added by the solver to make flipped levels completable
  const extra = level0.extraEchos || level.extraEchos || 0;
  for (let i = 0; i < extra; i++) tools.push({ t: 'fix', h: 3 });
  w.toolDefs = tools;
  tools.forEach((a, i) => {
    const pl = (placements && placements[i]) ? placements[i] : { x: 470 + i * 150, y: 345 };
    if (a.t === 'osc') {
      w.arrows.push({ x: pl.x, y: pl.y, h: a.h1, h1: a.h1, h2: a.h2,
                      period: a.period || 2.4, kind: 'osc', armed: true, di: i });
    } else {
      // angle may be overridden by the placement (pl.h) — used by the solver and
      // by the flip system, since flipped levels need freshly-chosen angles.
      const h = (pl.h != null) ? pl.h : a.h;
      w.arrows.push({ x: pl.x, y: pl.y, h, kind: 'fix', armed: true, di: i });
    }
  });
  return w;
}

function arrowAngleHour(a, t) {
  if (a.kind !== 'osc') return a.h;
  // ping-pong between h1 and h2, always sweeping the short way (e.g. 12 -> 2 goes through 1)
  let h2 = a.h2; if (h2 < a.h1) h2 += 12;
  const span = h2 - a.h1;
  const ph = (t % (a.period * 2)) / a.period;       // 0..2
  const k = ph < 1 ? ph : 2 - ph;                    // 0..1..0
  return a.h1 + span * k;
}

// ---------- one physics step ----------
function step(w) {
  if (w.done) return;
  const L = w.lvl;
  w.t += w.DTscale ? DT * w.DTscale : DT;

  // gravity + integrate
  w.v.y += GRAV * DT;
  const sp0 = Math.hypot(w.v.x, w.v.y);
  if (sp0 > MAXV) { w.v.x *= MAXV / sp0; w.v.y *= MAXV / sp0; }
  const ox = w.p.x, oy = w.p.y;
  w.p.x += w.v.x * DT;
  w.p.y += w.v.y * DT;

  // collisions (few iterations for stability)
  for (let it = 0; it < 3; it++) {
    let hit = false;
    const collide = (cp, half) => {
      let dx = w.p.x - cp.x, dy = w.p.y - cp.y;
      let d = Math.hypot(dx, dy);
      const min = BALLR + half;
      if (d >= min) return false;
      let nx, ny;
      if (d < 1e-6) { nx = 0; ny = -1; d = 0; } else { nx = dx / d; ny = dy / d; }
      w.p.x += nx * (min - d);
      w.p.y += ny * (min - d);
      const vn = w.v.x * nx + w.v.y * ny;
      if (vn < 0) {
        const e = (-vn < 90) ? 0 : 0.5;
        w.v.x -= (1 + e) * vn * nx;
        w.v.y -= (1 + e) * vn * ny;
        // tangential friction
        const tn = w.v.x * nx + w.v.y * ny;
        let tx = w.v.x - tn * nx, ty = w.v.y - tn * ny;
        tx *= 0.998; ty *= 0.998;
        w.v.x = tn * nx + tx; w.v.y = tn * ny + ty;
      }
      return true;
    };
    for (const r of (L.rects || [])) {
      const cp = closestOnRect(w.p.x, w.p.y, r);
      if (collide(cp, 0)) hit = true;
    }
    // moving floor: a band of vertical rods rising/falling as a travelling wave.
    // The ball rests on the rod tops; a rod moving UP imparts upward velocity, so
    // catching the wave at the right spot flings the ball along/up like a swell.
    for (const wf of (L.wavefloor || [])) {
      const n = wf.n || 50;
      const rodW = wf.w / n;
      if (w.p.x > wf.x - BALLR && w.p.x < wf.x + wf.w + BALLR) {
        const k = Math.floor((w.p.x - wf.x) / rodW);
        for (let kk = Math.max(0, k - 1); kk <= Math.min(n - 1, k + 1); kk++) {
          const rise = waveRise(wf, kk, w.t);
          const top = wf.y - rise;                 // current top of this rod (screen-y)
          const rx = wf.x + kk * rodW;
          // horizontal overlap with this rod column?
          if (w.p.x + BALLR < rx || w.p.x - BALLR > rx + rodW) continue;
          // collide with the rod's TOP edge if the ball is at/under it
          if (w.p.y + BALLR > top && w.p.y < top + 40) {
            // rod's vertical surface speed (px/s): d(rise)/dt, +up
            const riseNext = waveRise(wf, kk, w.t + DT);
            const rodVy = -(riseNext - rise) / DT;   // screen-y velocity of the top (neg=up)
            w.p.y = top - BALLR;                     // sit on top
            if (w.v.y > rodVy) {
              // bounce/transfer: take the rod's upward motion; gentle restitution
              const e = 0.25;
              const rel = w.v.y - rodVy;
              w.v.y = rodVy - e * rel;
              // a rising rod adds extra launch impulse (the 'sweet spot' kick)
              if (rodVy < 0) w.v.y += rodVy * 0.6;
            }
            hit = true;
          }
        }
      }
    }
    // gate bars: a solid vertical bar that slides up and down. It blocks the path
    // (a gap above toward the roof, a gap below toward a hole), and catching its
    // TOP as it rises launches the ball upward.
    for (const g of (L.gatebars || [])) {
      const span = (g.yBot - g.yTop);
      const ph = Math.sin((w.t / (g.period || 2.4)) * Math.PI * 2) * 0.5 + 0.5; // 0..1
      const barTop = g.yTop + span * ph;                 // current top of the bar
      const barRect = [g.x, barTop, g.w, g.h || 200];
      const cp = closestOnRect(w.p.x, w.p.y, barRect);
      let dx = w.p.x - cp.x, dy = w.p.y - cp.y, d = Math.hypot(dx, dy);
      if (d < BALLR) {
        let nx, ny; if (d < 1e-6) { nx = 0; ny = -1; } else { nx = dx / d; ny = dy / d; }
        w.p.x += nx * (BALLR - d); w.p.y += ny * (BALLR - d);
        const vn = w.v.x * nx + w.v.y * ny;
        if (vn < 0) { const e = 0.3; w.v.x -= (1 + e) * vn * nx; w.v.y -= (1 + e) * vn * ny; }
        // bar vertical speed (screen-y, neg = up)
        const phN = Math.sin(((w.t + DT) / (g.period || 2.4)) * Math.PI * 2) * 0.5 + 0.5;
        const barVy = (g.yTop + span * phN - barTop) / DT;
        // if hit on top while the bar rises, launch the ball up with the bar
        if (ny < -0.3 && barVy < 0) { w.v.y += barVy * 1.4; }
        hit = true;
      }
    }
    // bouncy walls: rects that reflect the ball with high restitution
    for (const r of (L.bouncy || [])) {
      const cp = closestOnRect(w.p.x, w.p.y, r);
      let dx = w.p.x - cp.x, dy = w.p.y - cp.y, d = Math.hypot(dx, dy);
      if (d < BALLR) {
        let nx, ny; if (d < 1e-6) { nx = 0; ny = -1; } else { nx = dx / d; ny = dy / d; }
        w.p.x += nx * (BALLR - d); w.p.y += ny * (BALLR - d);
        const vn = w.v.x * nx + w.v.y * ny;
        if (vn < 0) { const e = 1.15; w.v.x -= (1 + e) * vn * nx; w.v.y -= (1 + e) * vn * ny;
          w.events.push({ t: w.t, kind: 'bounce', x: cp.x, y: cp.y }); }
        hit = true;
      }
    }
    // cogs: a hub disc (radius r) with a few BIG teeth and WIDE gaps. The ball
    // rests against the body and nestles into a gap; the rotating teeth carry it
    // around. A tooth sweeping into the ball from behind pushes it tangentially.
    (L.cogs || []).forEach((c, ci) => {
      const dx = w.p.x - c.x, dy = w.p.y - c.y; const d = Math.hypot(dx, dy);
      const tooth = (c.tooth != null ? c.tooth : 30);    // tooth length beyond body
      const nteeth = c.teeth || 5;                         // few teeth -> wide gaps
      const spin = c.spin || 1;
      const surf = (c.surf != null ? c.surf : 320);
      const cogAng = w.t * (surf / Math.max(40, c.r)) * spin;   // body angular pos
      // 1) collide with the hub body (ball rolls on the rim, sits in gaps)
      if (d < BALLR + c.r && d > 1e-6) {
        const nx = dx / d, ny = dy / d;
        w.p.x += nx * (BALLR + c.r - d); w.p.y += ny * (BALLR + c.r - d);
        const vn = w.v.x * nx + w.v.y * ny;
        if (vn < 0) { const e = 0.18; w.v.x -= (1 + e) * vn * nx; w.v.y -= (1 + e) * vn * ny; }
        // gentle carry: nudge tangential velocity toward rim speed
        const tx = -ny * spin, ty = nx * spin;
        const curT = w.v.x * tx + w.v.y * ty;
        const dT = (surf - curT) * 0.18;
        w.v.x += tx * dT; w.v.y += ty * dT;
        hit = true;
      }
      // 2) teeth: thin radial pegs that bat the ball if one sweeps into it
      for (let k = 0; k < nteeth; k++) {
        const a2 = cogAng + k * (Math.PI * 2 / nteeth);
        const tipx = c.x + Math.cos(a2) * (c.r + tooth);
        const tipy = c.y + Math.sin(a2) * (c.r + tooth);
        const basx = c.x + Math.cos(a2) * c.r;
        const basy = c.y + Math.sin(a2) * c.r;
        const cp = closestOnSeg(w.p.x, w.p.y, basx, basy, tipx, tipy);
        const ddx = w.p.x - cp.x, ddy = w.p.y - cp.y, dd = Math.hypot(ddx, ddy);
        if (dd < BALLR + SEG_TH && dd > 1e-6) {
          const nx = ddx / dd, ny = ddy / dd;
          w.p.x += nx * (BALLR + SEG_TH - dd); w.p.y += ny * (BALLR + SEG_TH - dd);
          const rr = Math.hypot(cp.x - c.x, cp.y - c.y) || 1;
          const tx = -(cp.y - c.y) / rr * spin, ty = (cp.x - c.x) / rr * spin;
          const tangSpeed = surf;
          w.v.x += tx * tangSpeed * DT * 4.0; w.v.y += ty * tangSpeed * DT * 4.0;
          hit = true;
        }
      }
    });
    // windmills: FREE-SPINNING rotors. Static until the ball pushes a blade, then
    // they spin up from that impulse, carry angular momentum, and fling the ball.
    (L.windmills || []).forEach((m, mi) => {
      const ang = w.wmAng[mi];
      let bestHit = null;
      for (let k = 0; k < 4; k++) {
        const a2 = ang + k * Math.PI / 2;
        const ex = m.x + Math.cos(a2) * m.len, ey = m.y + Math.sin(a2) * m.len;
        const cp = closestOnSeg(w.p.x, w.p.y, m.x, m.y, ex, ey);
        const dx = w.p.x - cp.x, dy = w.p.y - cp.y, d = Math.hypot(dx, dy);
        if (d < BALLR + SEG_TH && d > 1e-6) { bestHit = { cp, dx, dy, d }; break; }
      }
      if (bestHit) {
        const { cp, dx, dy, d } = bestHit;
        const nx = dx / d, ny = dy / d;
        w.p.x += nx * (BALLR + SEG_TH - d); w.p.y += ny * (BALLR + SEG_TH - d);
        // lever arm from hub to contact
        const rvx = cp.x - m.x, rvy = cp.y - m.y;
        const rr = Math.hypot(rvx, rvy) || 1;
        // blade tangential direction at contact (for current rotation sign)
        const tx = -rvy / rr, ty = rvx / rr;
        // current blade surface velocity at contact
        const bladeSpeed = w.wmVel[mi] * rr;
        const bvx = tx * bladeSpeed, bvy = ty * bladeSpeed;
        // relative velocity of ball vs blade along the normal
        const rel = (w.v.x - bvx) * nx + (w.v.y - bvy) * ny;
        if (rel < 0) {
          const e = 0.45;
          w.v.x -= (1 + e) * rel * nx; w.v.y -= (1 + e) * rel * ny;
          // ball pushes the rotor: torque from the normal impulse component
          const torque = (nx * tx + ny * ty);   // how aligned the push is with spin
          const push = -rel;                     // magnitude of the inward hit
          w.wmVel[mi] += torque * push / rr * 0.9;
        }
        // the spinning blade also flings the ball along its tangential motion
        w.v.x += bvx * DT * 6.0; w.v.y += bvy * DT * 6.0;
        w.events.push({ t: w.t, kind: 'windmill', i: mi });
        hit = true;
      }
    });
    for (const s of (L.segs || [])) {
      const cp = closestOnSeg(w.p.x, w.p.y, s[0], s[1], s[2], s[3]);
      if (collide(cp, SEG_TH)) hit = true;
    }
    (L.doors || []).forEach((d, i) => {
      if (w.doorOpen[i]) return;
      const cp = closestOnSeg(w.p.x, w.p.y, d.x1, d.y1, d.x2, d.y2);
      const dd = Math.hypot(w.p.x - cp.x, w.p.y - cp.y);
      if (dd < BALLR + SEG_TH) {
        if (collide(cp, SEG_TH)) hit = true;
        // touch-trigger doors start their countdown on contact
        if (d.trig.k === 'touch' && w.doorTimer[i] < 0) {
          w.doorTimer[i] = d.trig.delay != null ? d.trig.delay : 0.38;
          w.events.push({ t: w.t, kind: 'doorArm', i });
        }
      }
    });
    if (!hit) break;
  }

  // buttons -> open linked doors
  (L.buttons || []).forEach((b, i) => {
    const dx = w.p.x - b.x, dy = w.p.y - b.y;
    if (Math.hypot(dx, dy) < BALLR + 24 && !w.btnDown[i]) {
      w.btnDown[i] = true;
      if (!w.doorOpen[b.door]) { w.doorOpen[b.door] = true; w.events.push({ t: w.t, kind: 'doorOpen', i: b.door }); }
    }
  });

  // timed / touch door countdowns
  (L.doors || []).forEach((d, i) => {
    if (w.doorOpen[i]) return;
    if (d.trig.k === 'timed' && w.t >= d.trig.t) { w.doorOpen[i] = true; w.events.push({ t: w.t, kind: 'doorOpen', i }); }
    if (d.trig.k === 'touch' && w.doorTimer[i] >= 0) {
      w.doorTimer[i] -= DT;
      if (w.doorTimer[i] <= 0) { w.doorOpen[i] = true; w.events.push({ t: w.t, kind: 'doorOpen', i }); }
    }
  });

  // echos: SINGLE-USE deflector. The echo points in an aim direction (its 0deg
  // point). The ball is "sucked in" and slung OUT along the aim, but the exit is
  // blended with which SIDE of the aim axis the ball entered: entering left of an
  // up-pointing echo slings it up-AND-right; entering right slings it up-and-left.
  // This lets an up echo move the ball sideways. Boost on exit, then decays.
  for (const a of w.arrows) {
    if (a.spent) continue;
    const d = Math.hypot(w.p.x - a.x, w.p.y - a.y);
    if (d < ARROW_R + BALLR) {
      const dir = hourDir(arrowAngleHour(a, w.t));        // aim (unit)
      // perpendicular (right-hand) to the aim
      const px = -dir.y, py = dir.x;
      // signed offset of the ENTRY point from the aim axis: which side did it enter?
      const rx = w.p.x - a.x, ry = w.p.y - a.y;
      let side = (rx * px + ry * py) / ARROW_R;           // ~[-1..1], + = right side
      side = Math.max(-1, Math.min(1, side));
      // also factor the incoming travel direction so a ball moving across the echo
      // keeps some of that momentum's sense (feels like being slung, not snapped).
      const sp0 = Math.hypot(w.v.x, w.v.y) || 1;
      const inx = w.v.x / sp0, iny = w.v.y / sp0;
      const inSide = inx * px + iny * py;                 // incoming lateral sense
      // blend: exit aim curved toward the side opposite the entry offset.
      // entering on the LEFT (side<0) curves exit toward +right (-side*perp).
      const curve = (-side * 0.85) + (inSide * 0.25);     // tangential strength
      let ex = dir.x + px * curve;
      let ey = dir.y + py * curve;
      const el = Math.hypot(ex, ey) || 1; ex /= el; ey /= el;
      w.v.x = ex * ECHO_BOOST;
      w.v.y = ey * ECHO_BOOST;
      w.boost = 1;
      a.spent = true;              // single-use
      w.events.push({ t: w.t, kind: 'arrow', x: a.x, y: a.y });
    }
  }
  // boost decay: while boosted and above normal launch speed, bleed speed off
  // smoothly so the ball returns to a gravity-normal pace after exiting.
  if (w.boost > 0) {
    const sp = Math.hypot(w.v.x, w.v.y);
    if (sp > ARROW_SPEED) {
      const ns = Math.max(ARROW_SPEED, sp - ECHO_DECAY * DT);
      w.v.x *= ns / sp; w.v.y *= ns / sp;
    } else { w.boost = 0; }
  }

  // free-spinning windmills: advance blade angle by angular velocity, decay slowly
  (L.windmills || []).forEach((m, mi) => {
    w.wmAng[mi] += w.wmVel[mi] * DT;
    // angular drag (free spin slowly winds down)
    w.wmVel[mi] *= (1 - 1.1 * DT);
    if (Math.abs(w.wmVel[mi]) < 0.02) w.wmVel[mi] = 0;
    // clamp to avoid runaway
    if (w.wmVel[mi] > 14) w.wmVel[mi] = 14;
    if (w.wmVel[mi] < -14) w.wmVel[mi] = -14;
  });

  // flippers (auto-fire, once per attempt)
  (L.flippers || []).forEach((f, i) => {
    w.flipAnim[i] = Math.max(0, w.flipAnim[i] - DT * 4);
    const d = Math.hypot(w.p.x - f.x, w.p.y - f.y);
    if (d < FLIP_R && w.flipCd[i] <= 0) {
      w.flipCd[i] = 1e9;  // fired — stays spent until retry
      const dir = hourDir(f.h);
      w.v.x = dir.x * FLIP_SPEED;
      w.v.y = dir.y * FLIP_SPEED;
      w.flipAnim[i] = 1;
      w.events.push({ t: w.t, kind: 'flip', i });
    }
  });

  // portals
  let warped = false;
  (L.portals || []).forEach((pt, i) => {
    if (w.portalCd[i] > 0) {
      const dOut = Math.hypot(w.p.x - pt.bx, w.p.y - pt.by);
      if (dOut > PORTAL_R + 16) w.portalCd[i] = 0;
      return;
    }
    const d = Math.hypot(w.p.x - pt.ax, w.p.y - pt.ay);
    if (d < PORTAL_R) {
      w.p.x = pt.bx; w.p.y = pt.by;
      w.portalCd[i] = 1;
      w.warpN[i]++;
      warped = true;
      if (w.warpN[i] > 4) { w.fail = 'lost'; w.done = true; }
      w.events.push({ t: w.t, kind: 'warp', i });
      w.pts.push(null);                 // break the trail
      w.pts.push({ x: w.p.x, y: w.p.y });
    }
  });

  // path accumulation — a portal teleport jumps the ball instantly, so that
  // inter-portal distance must NOT count toward the path length / score.
  const seg = warped ? 0 : Math.hypot(w.p.x - ox, w.p.y - oy);
  w.path += seg;
  // ball spin: rolling proportional to distance travelled, signed by horizontal direction
  w.spin += (seg / BALLR) * (w.v.x >= 0 ? 1 : -1);
  const last = w.pts[w.pts.length - 1];
  if (!last || Math.hypot(w.p.x - last.x, w.p.y - last.y) > 18) w.pts.push({ x: w.p.x, y: w.p.y });

  // win: catch if any part of the ball overlaps any part of the hanging white bat.
  // The bat spans vertically ~white.y-16 (body at ceiling) to ~white.y+54 (ear tips),
  // ~24px half-width. Test ball-vs-rounded-box overlap so a graze still counts.
  {
    const bw = 24, byTop = L.white.y - 16, byBot = L.white.y + 54, cx = L.white.x;
    const nxp = Math.max(cx - bw, Math.min(cx + bw, w.p.x));
    const nyp = Math.max(byTop, Math.min(byBot, w.p.y));
    const dw = Math.hypot(w.p.x - nxp, w.p.y - nyp);
    if (dw < BALLR + 6) {
      w.won = true; w.done = true;
      w.pts.push({ x: L.white.x, y: L.white.y + 26 });
      return;
    }
  }

  // fail conditions
  const sp = Math.hypot(w.v.x, w.v.y);
  if (sp < 14) { w.stall += DT; if (w.stall > STALL_T) { w.fail = 'stalled'; w.done = true; } }
  else w.stall = 0;
  if (w.p.y > H + 160 || w.p.x < -160 || w.p.x > W + 160) { w.fail = 'lost'; w.done = true; }
  if (w.t > TIME_CAP) { w.fail = 'time'; w.done = true; }
}

function score(w) { return Math.max(1, 999 - Math.round(w.path / SCORE_DIV)); }

// run a full headless game; returns result
function simulate(level, placements) {
  const w = makeWorld(level, placements);
  const maxSteps = Math.ceil(TIME_CAP / DT) + 10;
  for (let i = 0; i < maxSteps && !w.done; i++) step(w);
  return { won: w.won, fail: w.fail, score: score(w), path: w.path, t: w.t, pts: w.pts };
}

return { W, H, DT, GRAV, BALLR, SEG_TH, ARROW_SPEED, ARROW_R, FLIP_R, PORTAL_R, WIN_R,
         hourDir, arrowAngleHour, makeWorld, step, score, simulate, closestOnRect, closestOnSeg };
})();

/* ============ persistence ============ */
const SAVE_KEY='batphysics.v1';
const Store={
  data:{stars:{},best:{},unlocked:1},
  load(){ try{const r=localStorage.getItem(SAVE_KEY); if(r)this.data=JSON.parse(r);}catch(e){} 
          if(!this.data.stars)this.data={stars:{},best:{},unlocked:1}; },
  save(){ try{localStorage.setItem(SAVE_KEY,JSON.stringify(this.data));}catch(e){} },
  starsFor(id){return this.data.stars[id]||0;},
  bestFor(id){return this.data.best[id]||0;},
  bestPlacementFor(id){return (this.data.bestPos&&this.data.bestPos[id])||null;},
  unlocked(id){return id<=this.data.unlocked;},
  record(id,stars,score,placement){
    if(stars>this.starsFor(id))this.data.stars[id]=stars;
    if(score>this.bestFor(id)){
      this.data.best[id]=score;
      if(placement){ this.data.bestPos=this.data.bestPos||{}; this.data.bestPos[id]=placement; }
    }
    if(stars>=1 && id+1>this.data.unlocked && id<100)this.data.unlocked=id+1;
    this.save();
  },
  totalStars(){let s=0;for(const k in this.data.stars)s+=this.data.stars[k];return s;},
  totalScore(){let s=0;for(const k in this.data.best)s+=this.data.best[k];return s;},
  cleared(){return Object.keys(this.data.best).filter(k=>this.data.best[k]>0).length;}
};

/* ============ canvas + camera ============ */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let VIEW={s:1,ox:0,oy:0,W:0,H:0,dpr:1};
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=window.innerWidth,h=window.innerHeight;
  cv.width=w*dpr; cv.height=h*dpr; cv.style.width=w+'px'; cv.style.height=h+'px';
  VIEW.dpr = dpr; VIEW.W = w; VIEW.H = h;
  // Scale so the full WIDTH fits; the active play band (top of cave down through the
  // bats and obstacles) is then centred vertically. The dead floor area below the
  // action is allowed to clip off the bottom so the playfield sits centred rather
  // than pinned high with a big empty ceiling band. Purely visual — world coords
  // and physics are unchanged.
  // v2 camera. The play band (world 320..900) always sits below the top bar.
  // Fit the full width when there's room; on a short screen fit the height
  // instead and let cave walls fill the sides. Spare height becomes roof first
  // (so the ceiling clears the top bar), then is split between roof and floor.
  const probe = document.getElementById('saProbe');
  const hudB = (probe ? probe.offsetHeight : 0) + 74;
  const band = 580;
  const s = Math.min(w/BP.W, (h - hudB)/band);
  VIEW.s = s; VIEW.ox = (w - BP.W*s)/2;
  const spare = h/s - band;
  let roof = Math.min(spare, Math.max(spare/2, 160));
  roof = Math.max(roof, Math.min(hudB/s, spare));
  VIEW.oy = -(320 - roof)*s;
  // landscape-only: show a rotate prompt when the device is portrait.
  // Use a media query, NOT window.orientation (undefined in an iOS standalone
  // home-screen app) or the deprecated orientationchange event: matchMedia
  // behaves the same in Safari and in a standalone window.
  const portrait = window.matchMedia
    ? window.matchMedia('(orientation: portrait)').matches
    : (h > w);
  const rp=document.getElementById('rotate');
  if(rp) rp.style.display = portrait ? 'flex' : 'none';
}
window.addEventListener('resize',resize);
// Orientation via matchMedia — fires reliably in Safari AND iOS standalone,
// where orientationchange does not. Re-read after a short delay too, since iOS
// can report stale innerWidth/innerHeight at the instant the query flips.
if(window.matchMedia){
  const mq=window.matchMedia('(orientation: portrait)');
  const onOri=()=>{ resize(); setTimeout(resize,120); };
  if(mq.addEventListener) mq.addEventListener('change',onOri);
  else if(mq.addListener) mq.addListener(onOri);   // older Safari
}

function applyBaseTransform(){
  const dpr=VIEW.dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function toScreen(wx,wy){return{x:wx*VIEW.s+VIEW.ox,y:wy*VIEW.s+VIEW.oy};}
function toWorld(cx,cy){
  return { x:(cx-VIEW.ox)/VIEW.s, y:(cy-VIEW.oy)/VIEW.s };
}

const Render=(()=>{
  function hr(h){return BP.hourDir(h);}
  // Per-chapter palette: sunrise orange (1) -> dusk purple -> deep night blue (10).
  // Each entry: sky top/mid/bottom, glow pool color, rock top/bottom, rock rim.
  const PAL=[
    null,
    {sky:['#3a1e0a','#6e3410','#1a0f08'], glow:'#ff9a3c', rock:['#5a3a1e','#241509'], rim:'#ffc08a'},
    {sky:['#3a230c','#7a3e12','#1c1108'], glow:'#ff8a3a', rock:['#5c3c20','#26160a'], rim:'#ffc07a'},
    {sky:['#33203a','#6e3a5e','#1a0f1c'], glow:'#ff7bd0', rock:['#4a2e52','#1e1226'], rim:'#e79bd0'},
    {sky:['#2c1f44','#54356e','#160f24'], glow:'#b07bff', rock:['#3e2e5c','#180f28'], rim:'#c9a0ff'},
    {sky:['#241f4a','#3a3a72','#120f28'], glow:'#8a7bff', rock:['#2e3160','#100f24'], rim:'#a9b0ff'},
    {sky:['#1c2150','#2c3a76','#0e1024'], glow:'#5f8bff', rock:['#243660','#0c1024'], rim:'#7fb0ff'},
    {sky:['#161f48','#243a6e','#0a0f22'], glow:'#4fa8e0', rock:['#1e3258','#0a0f20'], rim:'#6fc0e0'},
    {sky:['#101a40','#1a2f60','#080c1e'], glow:'#37c0c8', rock:['#182a4e','#080c1c'], rim:'#46d0c0'},
    {sky:['#0c1530','#142450','#060a18'], glow:'#37e0c8', rock:['#122244','#060a16'], rim:'#37e0c8'},
    {sky:['#080f24','#0e1a3c','#04060f'], glow:'#37e0a0', rock:['#0e1a38','#04060e'], rim:'#37e0c8'},
  ];
  function pal(){ const p=bdPal(); return {sky:[p.base,p.base,p.base], glow:'#a9d8ff', rock:p.rock, rim:p.rim}; }
  function rhb(n){ const x=Math.sin(n*91.7)*43758.5; return x-Math.floor(x); }
  // ---- stylised cave backdrops (purely decorative; behind the play area) ----
  // Scene A: a deep field of hanging stalactites silhouetted in the upper cavern.
  function backdropStalactites(x0,y0,w,h,P){
    ctx.save();
    ctx.beginPath(); ctx.rect(x0,y0,w,h); ctx.clip();
    // layered rows, far (faint) -> near (darker), each a run of triangular spikes
    const rows=4;
    for(let r=0;r<rows;r++){
      const depth=r/(rows-1);
      const baseY=y0 + h*(0.04+0.10*r);
      const col = depth<0.5? P.rock[0] : P.rock[1];
      ctx.globalAlpha=0.18+0.16*r;
      ctx.fillStyle=col;
      const n=Math.round(w/(70- r*8)/VIEW.s);
      const step=w/n;
      ctx.beginPath(); ctx.moveTo(x0,baseY-20);
      for(let i=0;i<=n;i++){
        const cx=x0+i*step;
        const len=(20+rhb(r*13+i)*70+r*22)*VIEW.s;
        const halfw=step*0.5;
        ctx.lineTo(cx-halfw, baseY);
        ctx.lineTo(cx+(rhb(r*7+i)-0.5)*halfw*0.6, baseY+len);
        ctx.lineTo(cx+halfw, baseY);
      }
      ctx.lineTo(x0+w,baseY-20); ctx.closePath(); ctx.fill();
    }
    ctx.restore(); ctx.globalAlpha=1;
  }
  // Scene B: a bright cave-mouth arch with tiny bats streaming out against the sky.
  function backdropCaveMouth(x0,y0,w,h,P){
    ctx.save();
    ctx.beginPath(); ctx.rect(x0,y0,w,h); ctx.clip();

      const a=rhb(i*3.1)*6.28 + t*0.05;

  // Scene C: diagonal volumetric light shafts cutting across the cavern.
  function backdropLightShafts(x0,y0,w,h,P){

  // Scene D: a smooth banded underground canyon converging to a dark passage, with
  // a green-tinted water pool reflecting at the bottom (from the river-cave photo).
  function backdropRiverCanyon(x0,y0,w,h,P){
    ctx.save();
    ctx.beginPath(); ctx.rect(x0,y0,w,h); ctx.clip();
    const cx=x0+w*0.52, vanish=y0+h*0.52;        // passage vanishing point
    // converging canyon walls (left and right), smooth banded rock
    for(const side of [-1,1]){
      const baseX = cx + side*w*0.05;

      g.addColorStop(0, P.rock[0]); g.addColorStop(1, '#0a0e16');
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.moveTo(side<0?x0:x0+w, y0);
      ctx.lineTo(side<0?x0:x0+w, y0+h*0.7);

      ctx.strokeStyle=P.rim; ctx.globalAlpha=0.10; ctx.lineWidth=2*VIEW.s;

    ctx.fillStyle=wg; ctx.fillRect(x0,waterTop,w,h-(waterTop-y0));

    ctx.globalAlpha=1;
    ctx.restore();
  }
  // Scene E: a warm-lit sloping cave wall densely covered with hanging bat
  // silhouettes (the roost photo). A diagonal ledge crack splits the wall.
  function backdropBatRoost(x0,y0,w,h,P){
    ctx.save();
    ctx.beginPath(); ctx.rect(x0,y0,w,h); ctx.clip();
    // warm wash + a soft lamp glow from upper-left
    const lg=ctx.createRadialGradient(x0+w*0.36,y0+h*0.42,8,x0+w*0.36,y0+h*0.42,w*0.5);
    lg.addColorStop(0, P.rim+'30'); lg.addColorStop(1, P.rim+'00');
    ctx.fillStyle=lg; ctx.fillRect(x0,y0,w,h);
    // diagonal crack/ledge across the wall
    const cy0=y0+h*0.34, cy1=y0+h*0.58;
    ctx.strokeStyle='#04060a'; ctx.globalAlpha=0.6; ctx.lineWidth=4*VIEW.s;
    ctx.beginPath(); ctx.moveTo(x0,cy0);
    for(let i=0;i<=8;i++){ const fx=x0+w*i/8; const fy=cy0+(cy1-cy0)*i/8+(rhb(i*4.2)-0.5)*16*VIEW.s; ctx.lineTo(fx,fy);} 
    ctx.stroke(); ctx.globalAlpha=1;
    // dense field of little hanging-bat silhouettes on the upper wall
    ctx.fillStyle='#0b0d14';
    const rows=7, cols=18;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const jx=(rhb(r*31+c)-0.5)*0.6, jy=(rhb(r*7+c*3)-0.5)*0.4;
      const bx=x0+w*((c+0.5+jx)/cols);
      const by=y0+h*(0.06+(r+0.5+jy)*0.045);
      // skip below the crack line so bats stay on the upper roost
      const crackY=cy0+(cy1-cy0)*((bx-x0)/w);
      if(by>crackY-6*VIEW.s) continue;
      ctx.globalAlpha=0.45+0.4*rhb(r*5+c*2);
      const s=(3+rhb(r+c)*3)*VIEW.s;
      // teardrop body
      ctx.beginPath(); ctx.ellipse(bx,by,s*0.6,s*1.3,0,0,7); ctx.fill();
      // a faint pale highlight on one (a lit bat, like the photo)
      if(r===3 && c===4){ ctx.globalAlpha=0.7; ctx.fillStyle='#d8d2c4';
        ctx.beginPath(); ctx.ellipse(bx,by,s*0.7,s*1.4,0,0,7); ctx.fill(); ctx.fillStyle='#0b0d14'; }
    }
    ctx.globalAlpha=1;
    ctx.restore();
  }

  SCENES.forEach(sc => { const im = new Image(); im.onload = () => { sc.img = im; }; im.src = SCENE_SRC[sc.key]; });
  const BD = { style: 'painted', lvl: 1, t0: performance.now(), motes: null, lc: null };
  function bdSetStyle() {}                                   // painted is the only style now
  function bdScene() { return SCENES[((BD.lvl || 1) - 1) % SCENES.length]; }
  function bdPal() { return bdScene().pal; }
  function bdFrame() { const sc = bdScene(), W = VIEW.W, H = VIEW.H, k = Math.max(W / sc.w, H / sc.h); return { k, ox: (W - sc.w * k) / 2, oy: (H - sc.h * k) / 2 }; }
  function rq(n) { const x = Math.sin(n * 78.233) * 43758.5453; return x - Math.floor(x); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  // light shafts: drawn small then scaled up, which blurs their edges into soft light
  const LIGHT_DS = 7;
  function bdShafts(sc, t) {
    const W = VIEW.W, H = VIEW.H, F = bdFrame();
    const cw = Math.ceil(W / LIGHT_DS), chh = Math.ceil(H / LIGHT_DS);
    if (!BD.lc || BD.lc.width !== cw || BD.lc.height !== chh) { BD.lc = document.createElement('canvas'); BD.lc.width = cw; BD.lc.height = chh; }
    const g = BD.lc.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cw, chh);
    g.setTransform(F.k / LIGHT_DS, 0, 0, F.k / LIGHT_DS, F.ox / LIGHT_DS, F.oy / LIGHT_DS);
    g.globalCompositeOperation = 'lighter';
    sc.shafts.forEach((s, i) => {
      const sh = 0.84 + 0.16 * Math.sin(t * 0.55 + i * 1.7);
      const tc = [(s.t[0][0] + s.t[1][0]) / 2, (s.t[0][1] + s.t[1][1]) / 2], ht = (s.t[1][0] - s.t[0][0]) / 2;
      const bc = [(s.b[0][0] + s.b[1][0]) / 2, (s.b[0][1] + s.b[1][1]) / 2], hb = (s.b[1][0] - s.b[0][0]) / 2;
      for (const [f, al] of [[1.7, 0.35], [0.9, 0.6], [0.45, 0.6]]) {
        const gr = g.createLinearGradient(tc[0], tc[1], bc[0], bc[1]);

        gr.addColorStop(0, `rgba(196,228,255,${A})`); gr.addColorStop(0.6, `rgba(172,214,255,${A * 0.55})`); gr.addColorStop(1, 'rgba(160,205,255,0)');
        g.fillStyle = gr; g.beginPath();

  }

  function bdMotes() {
    if (BD.motes) return BD.motes;
    const m = [];
    for (let i = 0; i < 70; i++) m.push({ s: i % 5 === 0 ? 2 : (i % 2 ? 1 : 0), u: rq(i), v: rq(i + 40) * 2 - 1, x: rq(i + 61), y: rq(i + 77),
      sp: 0.012 + rq(i + 90) * 0.02, r: 0.8 + rq(i + 7) * 1.6, ph: rq(i + 3) * 6.28 });
    return (BD.motes = m);

  // scene life, drawn in the photo's frame: dust in the shafts or drifting free,
  // bats flitting across the sky in the cave mouth, light moving on the river
  function bdLife(g, sc, t) {
    g.save(); g.globalCompositeOperation = 'lighter';
    const mote = sc.pal.mote;
    for (const m of bdMotes()) {
      let x, y, a;
      if (sc.shafts) {
        const s = sc.shafts[m.s], u = (m.u + t * m.sp) % 1;
        const cx = lerp((s.t[0][0] + s.t[1][0]) / 2, (s.b[0][0] + s.b[1][0]) / 2, u);
        const hw = lerp((s.t[1][0] - s.t[0][0]) / 2, (s.b[1][0] - s.b[0][0]) / 2, u);
        x = cx + (m.v + 0.15 * Math.sin(t * 0.7 + m.ph)) * hw * 0.85; y = lerp(s.t[0][1], s.b[0][1], u);
        a = (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 1.3 + m.ph))) * Math.sin(u * Math.PI) * 0.75;
      } else {
        x = ((m.x + t * m.sp * 0.25 * m.v) % 1 + 1) % 1 * sc.w; y = ((m.y + t * m.sp * 0.35) % 1) * sc.h;
        a = 0.18 * (0.5 + 0.5 * Math.sin(t * 1.1 + m.ph));

    }

      for (let i = 0; i < 9; i++) {

        const x = W2.x0 + drift, len = 40 + rq(i + 5) * 70, a = 0.10 + 0.08 * Math.sin(t * 1.7 + i);
        g.strokeStyle = `rgba(190,245,225,${a})`; g.lineWidth = 2.2;
        g.beginPath(); g.moveTo(x, yy + Math.sin(t * 2 + i) * 2); g.lineTo(x + len, yy + Math.sin(t * 2 + i + 1) * 2); g.stroke();
      }

    }
    if (sc.flock) {                                   // little bats flitting across the sky
      const fl = sc.flock; g.save(); g.fillStyle = 'rgba(14,14,18,0.85)';
      for (let i = 0; i < 18; i++) {
        const sp = 0.05 + rq(i) * 0.08, a0 = rq(i + 20) * 6.28, ang = a0 + t * sp * (i % 2 ? 1 : -1);
        const x = fl.cx + Math.cos(ang) * fl.rx * (0.4 + 0.6 * rq(i + 3)), y = fl.cy + Math.sin(ang * 1.3) * fl.ry * (0.4 + 0.6 * rq(i + 9));
        const s = 3 + rq(i + 30) * 4, flap = Math.sin(t * (9 + rq(i) * 4) + i) * 0.9;
        g.beginPath(); g.moveTo(x, y);
        g.quadraticCurveTo(x - s, y - s * flap, x - s * 2.1, y + s * 0.2); g.quadraticCurveTo(x - s, y + s * 0.15, x, y + s * 0.45);

  // the cave roof: solid rock from the top of the screen down to its craggy

  function bdRoof(path, by, edge) {
    const W = VIEW.W, F = bdFrame(), sc = bdScene(), P = sc.pal, t = (performance.now() - BD.t0) / 1000;
    const cs = ctx.createLinearGradient(0, by - 10, 0, by + 46 * VIEW.s);
    cs.addColorStop(0, 'rgba(0,0,0,0.55)'); cs.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = cs; ctx.fillRect(-10, by - 10, W + 20, 56 * VIEW.s + 10);
    ctx.save(); ctx.clip(path);
    ctx.fillStyle = P.base; ctx.fillRect(-10, -10, W + 20, by + 40);
    if (sc.img) { ctx.globalAlpha = 0.07; ctx.drawImage(sc.img, sc.w / 2, 0, sc.w / 2, sc.h * 0.44, -10, -10, W + 20, Math.max(by + 40, W * 0.22)); ctx.globalAlpha = 1; }
    const sh = ctx.createLinearGradient(0, by - 70 * VIEW.s, 0, by);
    sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, P.lip);
    ctx.fillStyle = sh; ctx.fillRect(-10, -10, W + 20, by + 40);
    ctx.strokeStyle = P.band; ctx.lineWidth = 14 * VIEW.s;
    ctx.beginPath(); edge.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
    if (sc.shafts) {

      sc.shafts.forEach((s, i) => {
        const yF = (by - F.oy) / F.k;
        const tc = [(s.t[0][0] + s.t[1][0]) / 2, (s.t[0][1] + s.t[1][1]) / 2], bc = [(s.b[0][0] + s.b[1][0]) / 2, (s.b[0][1] + s.b[1][1]) / 2];
        const u = (yF - tc[1]) / (bc[1] - tc[1]); if (u < 0 || u > 1) return;
        const x = F.ox + lerp(tc[0], bc[0], u) * F.k, hw = lerp(s.t[1][0] - s.t[0][0], s.b[1][0] - s.b[0][0], u) * F.k * 0.5;
        const a = s.a * (0.85 + 0.15 * Math.sin(t * 0.55 + i * 1.7));

    ctx.beginPath(); edge.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); ctx.restore();
  }

  // ===== v2 bats (redrawn) =====

  // bottom. A hanging bat is the same bat turned upside down, so ears, eyes, mouth and

  // long fingers with scalloped membrane between them, joined to the ankle).
  // tone 'dark' = the black bat (launcher), 'white' = the albino bat (catcher).
  const BAT_TONES = {
    dark:  { fur: '#25212c', fur2: '#3a3442', chest: '#4d4554', muzzle: '#3f3846', wing: '#2b2632', wing2: '#3e3647', bone: '#625870',
             ear: '#2a2531', inner: '#7d5669', nose: '#6e4c5d', iris: '#ffc94d', pupil: '#160f08', glint: '#fff7de', fang: '#f4efe6',

             ear: '#e6ebf0', inner: '#f4a2b5', nose: '#ef8ca4', iris: '#ff4f72', pupil: '#6a0b21', glint: '#ffeaf0', fang: '#ffffff',
             mouth: '#8a2a40', claw: '#c7a7b0', rim: 'rgba(255,255,255,0.75)' },
