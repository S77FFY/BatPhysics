      const ay=p.y+56*s;
      ctx.save();
      ctx.globalAlpha=0.35+0.65*flash;
      ctx.fillStyle='#37e0a0';
      ctx.shadowColor='#37e0a0'; ctx.shadowBlur=12*s;
      const aw=Math.max(9,14*s), ah=Math.max(11,18*s), st=Math.max(7,12*s);
      ctx.beginPath();
      ctx.moveTo(p.x, ay); ctx.lineTo(p.x-aw, ay+ah); ctx.lineTo(p.x-aw*0.4, ay+ah); ctx.lineTo(p.x-aw*0.4, ay+ah+st);
      ctx.lineTo(p.x+aw*0.4, ay+ah+st); ctx.lineTo(p.x+aw*0.4, ay+ah); ctx.lineTo(p.x+aw, ay+ah);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      const fpx=Math.round(Math.max(15,24*s));
      ctx.save();
      ctx.font='700 '+fpx+'px "National Park", system-ui, sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.shadowColor='rgba(0,0,0,0.85)'; ctx.shadowBlur=Math.max(4,8*s); ctx.shadowOffsetY=Math.max(1,2*s);
      ctx.fillStyle='#f4e8d2';
      ctx.fillText(label, p.x, ay+ah+st+Math.max(5,8*s));
      ctx.restore();
    }
  }
  function trail(pts,col,win,prog){
    // pts may contain nulls where a portal warped the ball: the line breaks there and the
    // jump isn't counted. prog (0..1) reveals the line by distance, black bat -> white bat.
    let total=0;
    for(let i=1;i<pts.length;i++) if(pts[i]&&pts[i-1]) total+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
    if(total<=0) return;
    let left=(prog==null?1:Math.max(0,Math.min(1,prog)))*total;
    ctx.save();
    ctx.strokeStyle=col;
    ctx.lineWidth=(win?8:4)*VIEW.s;
    ctx.setLineDash(win?[14*VIEW.s,12*VIEW.s]:[2*VIEW.s,10*VIEW.s]);
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    for(let i=0;i<pts.length;i++){
      const q=pts[i]; if(!q) continue;
      const prev=pts[i-1];
      if(!prev){ const p=toScreen(q.x,q.y); ctx.moveTo(p.x,p.y); continue; }   // start, or just out of a portal
      const d=Math.hypot(q.x-prev.x,q.y-prev.y);
      if(d<=left){ const p=toScreen(q.x,q.y); ctx.lineTo(p.x,p.y); left-=d; continue; }
      const f=d>0?left/d:0, p=toScreen(prev.x+(q.x-prev.x)*f, prev.y+(q.y-prev.y)*f);
      ctx.lineTo(p.x,p.y); break;
    }
    ctx.stroke();ctx.restore();
  }
  function ball(p,spin){
    const s=toScreen(p.x,p.y);const R=BP.BALLR*VIEW.s;
    ctx.save();
    ctx.shadowColor='#ffcf33';ctx.shadowBlur=12*VIEW.s;
    // base disc (yellow)
    ctx.fillStyle='#ffd23d';ctx.beginPath();ctx.arc(s.x,s.y,R,0,7);ctx.fill();
    ctx.shadowBlur=0;
    // spinning black quarters
    ctx.translate(s.x,s.y); ctx.rotate(spin||0);
    ctx.fillStyle='#111418';
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,0,Math.PI/2);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,Math.PI,Math.PI*1.5);ctx.closePath();ctx.fill();
    // rim
    ctx.rotate(-(spin||0));
    ctx.strokeStyle='#00000055';ctx.lineWidth=1.5*VIEW.s;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.stroke();
    ctx.restore();
  }
  function frame(w,opts){
    Render._ch = (w.lvl && w.lvl.ch) || 1; BD.lvl = (w.lvl && w.lvl.id) || 1;
    applyBaseTransform();
    bg(); const L=w.lvl;
    rock(L); wavefloor(L,w); gatebars(L,w); bouncy(L,w); cogs(L,w); windmills(L,w); doors(L,w); buttons(L,w); flippers(L,w); portals(L,w);
    if(w.won){
      // winning route: thick green dotted line revealed black-bat -> white-bat
      trail(w.pts, '#37e0a0', true, opts.pathProg!=null?opts.pathProg:1);
    } else if(opts.showTrail && w.pts.length>1){
      // in-flight breadcrumb (faint blue)
      trail(w.pts, '#5fd0ff66', false, 1);
    }
    echos(L,w,opts.launched);
    bat(L.black.x,L.black.y,false, opts.canFire?'Tap to release':'', opts.blackWing||0);
    bat(L.white.x,L.white.y,true,'', opts.whiteWing||0);
    if(opts.launched && !w.won) ball(w.p, w.spin);
  }
  return {frame, _ch:1, bdStyle:()=>BD.style, bdSetStyle, titleShow};
})();

/* ============ Game controller ============ */
const Game=(()=>{
  let L=null, w=null, launched=false, canFire=true, raf=0;
  let placements=[];           // {x,y} for drag arrows
  let dragIdx=-1, dragOff={x:0,y:0};
  let viewer=false, autoPlacing=false, preT=0;
  let resolved=false, paused=false;
  let pathProg=1, winAnim=0, winScore=0;
  let blackWing=0, whiteWing=0;

  // Default echo layout: spread across the open width near the ceiling, but skip any
  // slot that overlaps the black bat's launch zone (within the launch/grab radius)
  // so echos never sit on top of the bat where they'd block tapping to release.
  function defaultPlacements(L,nt){
    const out=[];
    const bx=L.black.x, by=L.black.y+26, LAUNCH=170;   // launch zone radius
    // candidate x slots across the playable width
    const slots=[];
    for(let x=180;x<=1420;x+=120) slots.push(x);
    // keep only slots clear of the launch zone (and not on the far wall edges)
    const clear=slots.filter(x=>Math.hypot(x-bx, 345-by) > LAUNCH);
    // prefer slots on the opposite side of the level from the black bat
    clear.sort((a,b)=> Math.abs(b-bx) - Math.abs(a-bx));
    for(let i=0;i<nt;i++){
      const x = clear.length? clear[i % clear.length] + (Math.floor(i/clear.length))*40 : 700+i*120;
      out.push({ x, y:345 });
    }
    return out;
  }
  function loadLevel(id, asViewer){
    viewer=!!asViewer; resolved=false;
    L=LEVELS[id-1];
    // arrows start parked on the left, stacked vertically, NOT in solution spots
    const probe=BP.makeWorld(L,null);
    const nt=(probe.toolDefs||[]).length;
    placements=defaultPlacements(L,nt);
    // if the player has a saved best layout for this level, load it on entry
    if(!viewer){ const best=Store.bestPlacementFor(id); if(best&&best.length===nt) placements=best.map(p=>({x:p.x,y:p.y,h:p.h})); }
    preT=0;
    rebuild(); launched=false; canFire=true;
    document.getElementById('lvlName').innerHTML=
      '<div id="lvlName2"><small>Level '+id+(viewer?' · viewer':'')+'</small>'+L.name+'</div>';
    document.getElementById('scoreNum').textContent='999';
    document.getElementById('result').classList.remove('on');
    document.getElementById('viewerTag').style.display=viewer?'block':'none';
    document.getElementById('viewerBadge').style.display=viewer?'flex':'none';
    // tutorial tip: show the level's intro message; dismissed on first touch
    const tipEl=document.getElementById('tip');
    if(L.tip){ const esc=L.tip.replace(/&/g,'&amp;').replace(/</g,'&lt;');
      document.getElementById('tipText').innerHTML=esc.replace(/\b[A-Z]{3,}\b/g, m=>'<b>'+m.toLowerCase()+'</b>'); tipEl.classList.add('on'); }
    else tipEl.classList.remove('on');
    UI.go('game'); loop();
  }
  function rebuild(){ w=BP.makeWorld(L,placements); if(!launched&&w) w.t=preT; }

  function fire(){
    if(launched||!canFire) return;
    launched=true; canFire=false; dragIdx=-1;
    blackWing=1;   // wings snap out as it launches
    // freeze oscillator phase at the moment of release: keep current w.t as the launch offset
  }
  function retry(){ launched=false; canFire=true; resolved=false;
    preT=0; pathProg=1; winAnim=0; blackWing=0; whiteWing=0;
    document.getElementById('result').classList.remove('on');
    document.getElementById('scoreNum').textContent='999';
    rebuild(); }
  function next(){ const id=L.id+1; if(id<=LEVELS.length && (viewer||Store.unlocked(id))) loadLevel(id,viewer); else UI.quitToSelect(); }

  function starsForScore(s){ if(s>=L.three)return 3; if(s>=L.two)return 2; return 1; }

  function finish(){
    if(resolved) return;
    resolved=true; const won=w.won;
    const sc=won?BP.score(w):0;
    const stars=won?starsForScore(sc):0;
    const r=document.getElementById('result');
    document.getElementById('rTitle').textContent=won?'Level complete':'Try again';
    document.getElementById('rTitle').className=won?'win':'lose';
    let starHtml='';
    for(let i=1;i<=3;i++)starHtml+='<span class="'+(i<=stars?'f':'e')+'">★</span>';
    document.getElementById('rStars').innerHTML=won?starHtml:'';
    if(won){
      const prevBest=viewer?0:Store.bestFor(L.id);
      document.getElementById('rScore').innerHTML='<b>'+sc+'</b> points'+
        (!viewer&&prevBest?'<span class="best">Best '+Math.max(prevBest,sc)+' · ★★ at '+L.two+' · ★★★ at '+L.three+'</span>'
                          :'<span class="best">★★ at '+L.two+' · ★★★ at '+L.three+'</span>');
      document.getElementById('rHint').textContent= stars<3 ? 'Shorter path = higher score. Find a tighter route for ★★★.' : 'Perfect route!';
    } else {
      document.getElementById('rScore').innerHTML='';
      document.getElementById('rHint').textContent='Reposition your echo(s) and try again.';
    }
    if(won && !viewer){ Store.record(L.id,stars,sc, placements.map(p=>({x:Math.round(p.x),y:Math.round(p.y),h:p.h}))); UI.refreshTitle(); }
    const nextBtn=document.getElementById('rNext');
    // show NEXT only when a next level actually exists and is unlocked; on the final
    // level there is no next, so the button is hidden (the player returns to the menu).
    const hasNext = L.id < LEVELS.length;
    const canNext = hasNext && (viewer || Store.unlocked(L.id+1));
    nextBtn.style.display=canNext?'inline-block':'none';
    document.getElementById('rRetry').classList.toggle('primary', !canNext);
    r.classList.add('on');
  }

  function viewerSolve(){
    // animate the reference solution from a known-good launch phase
    if(L.refSol&&L.refSol.length) placements=L.refSol.map(p=>({x:p.x,y:p.y}));
    retry(); preT=0; rebuild();
    setTimeout(()=>fire(),120);
    UI.toast('Playing reference solution · score '+L.refScore);
  }

  function nTools(){ return (w && w.toolDefs) ? w.toolDefs.length : 0; }

  // input
  function onDown(cx,cy){
    if(paused) return;
    // a tutorial tip showing? first touch just dismisses it.
    const tipEl=document.getElementById('tip');
    if(tipEl && tipEl.classList.contains('on')){ tipEl.classList.remove('on'); return; }
    // after release: a tap anywhere resets the ball and re-enables dragging
    if(launched){ retry(); return; }
    const wp=toWorld(cx,cy);
    // LAUNCH PRECEDENCE: a tap on/near the black bat rolls the ball, even if an
    // echo is parked nearby (makes launching reliable when an echo sits by the bat).
    const db=Math.hypot(wp.x-L.black.x, wp.y-(L.black.y+26));
    if(db<150){ fire(); return; }
    // otherwise pick nearest echo within a generous grab radius
    let best=-1,bd=1e9;
    for(let i=0;i<nTools();i++){
      const dd=Math.hypot(wp.x-placements[i].x,wp.y-placements[i].y);
      if(dd<bd&&dd<150){bd=dd;best=i;}
    }
    if(best>=0){ dragIdx=best; dragOff={x:placements[best].x-wp.x,y:placements[best].y-wp.y}; return; }
  }
  function onMove(cx,cy){
    if(dragIdx<0) return;
    const wp=toWorld(cx,cy);
    let nx=wp.x+dragOff.x, ny=wp.y+dragOff.y;
    // allow placement right up to (and slightly past) the world edges, keeping
    // only a few px of the echo on-screen so it can still be grabbed back.
    const m = BP.ARROW_R - 8;            // how far the center may go past the edge
    nx=Math.max(-m, Math.min(BP.W+m, nx));
    ny=Math.max(-m, Math.min(BP.H+m, ny));
    placements[dragIdx]={x:nx,y:ny}; rebuild();
  }
  function onUp(){ dragIdx=-1; }

  let last=0, acc=0, winStartScore=999;
  function loop(){
    cancelAnimationFrame(raf);
    last=performance.now(); acc=0;
    const gameEl=document.getElementById('game');
    const tick=(ts)=>{
      if(!gameEl.classList.contains('on')){ raf=0; return; }
      raf=requestAnimationFrame(tick);
      let dt=(ts-last)/1000; last=ts;
      if(dt>0.1)dt=0.1;                 // clamp after tab-switch
      if(paused){ Render.frame(w,{launched,canFire:false,showTrail:launched,pathProg,blackWing,whiteWing}); return; }
      if(launched&&!w.done){
        acc+=dt;
        let guard=0;
        while(acc>=BP.DT && !w.done && guard<600){ BP.step(w); acc-=BP.DT; guard++; }
        // score stays at 999 during flight — do NOT update live
        if(w.done){
          if(w.won){
            // begin path-reveal + score-countdown animation
            pathProg=0; winAnim=0; winScore=BP.score(w);
            document.getElementById('scoreNum').textContent='999';
          } else if(!resolved){ setTimeout(finish,420); }
        }
      } else if(!launched){
        // pre-launch: keep oscillators sweeping by advancing the world clock only
        preT+=dt; if(w) w.t=preT;
      }
      // win animation: reveal the green path, then count the score down
      if(w && w.won && !resolved){
        winAnim+=dt;
        const REVEAL=2.2, HOLD=0.5;
        pathProg=Math.min(1, winAnim/REVEAL);
        document.getElementById('scoreNum').textContent=String(Math.round(999+(winScore-999)*pathProg));
        if(winAnim>=REVEAL+HOLD && !resolved) finish();
      }
      // wing animation
      // black bat: wings snap out on launch, fold back over ~0.6s
      if(launched){ blackWing = Math.max(0, blackWing - dt/0.6); }
      else { blackWing = 0; }
      // white bat: wings spread open when it receives the ball (win), and stay
      if(w && w.won){ whiteWing = Math.min(1, whiteWing + dt/0.3); }
      else { whiteWing = 0; }

      Render.frame(w,{launched,canFire:canFire&&!launched,showTrail:launched,pathProg,blackWing,whiteWing});
    };
    raf=requestAnimationFrame(tick);
  }

  function pause(){ paused=true; }
  function setPaused(v){ paused=v; }
  function resumeGame(){ paused=false; }
  function arrowsToDefault(){
    const nt=nTools();
    placements=defaultPlacements(L,nt);
    launched=false; canFire=true; resolved=false; preT=0; pathProg=1; winAnim=0;
    rebuild();
  }
  function arrowsToBest(){
    const best=Store.bestPlacementFor(L.id);
    if(!best||!best.length) return false;
    placements=best.map(p=>({x:p.x,y:p.y}));
    launched=false; canFire=true; resolved=false; preT=0; pathProg=1; winAnim=0;
    rebuild(); return true;
  }
  function hasBest(){ const b=Store.bestPlacementFor(L?L.id:0); return !!(b&&b.length); }

  return {loadLevel,fire,retry,next,onDown,onMove,onUp,viewerSolve,
          pause,setPaused,resumeGame,arrowsToDefault,arrowsToBest,hasBest,
          get launched(){return launched;}, get viewer(){return viewer;}, get paused(){return paused;}};
})();

/* pointer wiring — listen on the game screen overlay (it sits above the canvas),
   so drags aren't swallowed by the overlay. HUD buttons stop propagation via their own handlers. */
(function(){
  let active=false;
  const surface=document.getElementById('game');
  const xy=e=>({x:e.clientX,y:e.clientY});
  surface.addEventListener('pointerdown',e=>{
    // ignore taps that start on an actual control (buttons, pills)
    if(e.target.closest('.icbtn,.btn,.pbtn,#result,#pause')) return;
    active=true; const p=xy(e); Game.onDown(p.x,p.y);
  });
  surface.addEventListener('pointermove',e=>{if(active){const p=xy(e);Game.onMove(p.x,p.y);}});
  window.addEventListener('pointerup',()=>{active=false;Game.onUp();});
  window.addEventListener('pointercancel',()=>{active=false;Game.onUp();});
})();

/* ============ UI ============ */
// ===== v2 music: dark, haunting EDM played live with Web Audio (no audio files) =====
// 112 BPM four-on-the-floor in D minor (Dm - Bb - Gm - A). A 32-bar song: a quiet
// intro, the beat, the full drop with a ghostly lead, a breakdown, a build, then it
// loops from the beat. Starts on the first tap (browsers need one), fades in, sleeps
// when the app is in the background, and remembers if you switch it off.
const Music = (() => {
  const BPM = 112, S = 60 / BPM / 4, VOL = 0.5, KEY = 'batphysics.music';
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const CHORDS = [   // two bars each; the A major's C# gives the haunted lift back to Dm
    { root: 38, pad: [50, 53, 57, 62], arp: [62, 65, 69, 74, 69, 65] },
    { root: 34, pad: [50, 53, 58, 62], arp: [58, 62, 65, 70, 65, 62] },
    { root: 43, pad: [50, 55, 58, 62], arp: [55, 58, 62, 67, 62, 58] },
    { root: 45, pad: [49, 52, 57, 61], arp: [57, 61, 64, 69, 64, 61] },
  ];
  const MELODY = [   // [bar of 8, 16th step, note, length in 16ths]
    [0, 0, 69, 12], [0, 12, 67, 4], [1, 0, 65, 16],
    [2, 0, 65, 8], [2, 8, 74, 8], [3, 0, 70, 16],
    [4, 0, 67, 8], [4, 8, 70, 8], [5, 0, 74, 12], [5, 12, 72, 4],
    [6, 0, 73, 16], [7, 0, 76, 8], [7, 8, 69, 8],
  ];

  function impulse(c, secs, decay) {           // a long cave reverb tail
    const n = Math.floor(c.sampleRate * secs), b = c.createBuffer(2, n, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay);
    }
    return b;
  }
  function noiseBuf(c) {
    const n = c.sampleRate * 2, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function build(c, out) {
    const N = { c };
    N.master = c.createGain(); N.master.gain.value = 0;
    N.tone = c.createBiquadFilter(); N.tone.type = 'lowpass'; N.tone.frequency.value = 18000; N.tone.Q.value = 0.4;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    N.master.connect(N.tone); N.tone.connect(comp); comp.connect(out);
    N.bus = c.createGain(); N.bus.connect(N.master);                  // everything except the kick
    N.duck = c.createGain(); N.duck.connect(N.bus);                    // pad, bass, arp: pumped by the kick
    N.verb = c.createConvolver(); N.verb.buffer = impulse(c, 3.4, 2.8);
    N.verbSend = c.createGain(); N.verbSend.connect(N.verb);
    const vr = c.createGain(); vr.gain.value = 0.45; N.verb.connect(vr); vr.connect(N.bus);
    N.dly = c.createDelay(2); N.dly.delayTime.value = S * 3;          // dotted-eighth echo
    const fb = c.createGain(), dl = c.createBiquadFilter(), dr = c.createGain();
    fb.gain.value = 0.4; dl.type = 'lowpass'; dl.frequency.value = 2300; dr.gain.value = 0.5;
    N.dly.connect(dl); dl.connect(fb); fb.connect(N.dly); dl.connect(dr); dr.connect(N.bus); dr.connect(N.verbSend);
    N.dlySend = c.createGain(); N.dlySend.connect(N.dly);
    N.noise = noiseBuf(c);
    return N;
  }

  function osc(c, type, f, t, end, det) { const o = c.createOscillator(); o.type = type; o.frequency.value = f; if (det) o.detune.value = det; o.start(t); o.stop(end); return o; }
  function noiseHit(N, t, len, type, f, q, vol, dest) {
    const c = N.c, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = N.noise; fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0001, vol * 0.015), t + len); g.gain.linearRampToValueAtTime(0, t + len + 0.01);
    s.connect(fl); fl.connect(g); g.connect(dest);
    s.start(t, Math.random() * 1.5); s.stop(t + len + 0.03);
    return g;
  }
  function kick(N, t) {
    const c = N.c, o = osc(c, 'sine', 165, t, t + 0.46), g = c.createGain();
    o.frequency.setValueAtTime(165, t); o.frequency.exponentialRampToValueAtTime(47, t + 0.13);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.95, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
    o.connect(g); g.connect(N.master);
    noiseHit(N, t, 0.014, 'highpass', 1800, 0.5, 0.2, N.master);       // a click, so phone speakers hear it
    const d = N.duck.gain; d.setValueAtTime(0.25, t); d.linearRampToValueAtTime(1, t + 0.22);
  }
  function hat(N, t, vol, open) { noiseHit(N, t, open ? 0.3 : 0.065, 'highpass', 7000, 0.7, vol, N.bus); }
  function clap(N, t) {
    for (let i = 0; i < 3; i++) noiseHit(N, t + i * 0.011, 0.02, 'bandpass', 1500, 0.9, 0.42, N.bus);
    noiseHit(N, t + 0.033, 0.2, 'bandpass', 1300, 0.7, 0.32, N.bus).connect(N.verbSend);
  }
  function bass(N, t, m, len, accent) {
    const c = N.c, f = mtof(m), fl = c.createBiquadFilter(), g = c.createGain(), end = t + len + 0.02;
    fl.type = 'lowpass'; fl.Q.value = 5;
    fl.frequency.setValueAtTime(240 + 1100 * accent, t); fl.frequency.exponentialRampToValueAtTime(170, t + len * 0.9);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.006); g.gain.setValueAtTime(0.2, t + len * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    osc(c, 'sawtooth', f, t, end, -8).connect(fl); osc(c, 'sawtooth', f, t, end, 8).connect(fl);
    const sg = c.createGain(); sg.gain.value = 0.8; osc(c, 'sine', f, t, end).connect(sg); sg.connect(g);
    fl.connect(g); g.connect(N.duck);
  }
  function pad(N, t, notes, len) {
    const c = N.c, g = c.createGain(), fl = c.createBiquadFilter(), end = t + len + 0.9;
    fl.type = 'lowpass'; fl.Q.value = 1;
    fl.frequency.setValueAtTime(480, t); fl.frequency.linearRampToValueAtTime(1300, t + len * 0.5); fl.frequency.linearRampToValueAtTime(560, t + len);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.045, t + 0.9); g.gain.setValueAtTime(0.045, t + len - 0.3); g.gain.linearRampToValueAtTime(0.0001, t + len + 0.8);
    for (const m of notes) for (const det of [-12, 0, 12]) osc(c, 'sawtooth', mtof(m), t, end, det + (Math.random() - 0.5) * 5).connect(fl);
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 190;   // keep the low end for the bass
    fl.connect(hp); hp.connect(g); g.connect(N.duck); g.connect(N.verbSend);
  }
  function pluck(N, t, m, vol) {                 // a glassy bell, mostly heard through its echo
    const c = N.c, g = c.createGain(), fl = c.createBiquadFilter(), g2 = c.createGain(), end = t + 0.42;
    fl.type = 'lowpass'; fl.frequency.setValueAtTime(3400, t); fl.frequency.exponentialRampToValueAtTime(700, t + 0.3);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
    g2.gain.value = 0.3;
    osc(c, 'triangle', mtof(m), t, end).connect(fl); osc(c, 'sine', mtof(m + 12), t, end).connect(g2); g2.connect(fl);
    fl.connect(g); g.connect(N.duck); g.connect(N.dlySend);
  }
  function ghost(N, t, m, len) {                 // the haunting voice: soft sines with a slow vibrato
    const c = N.c, f = mtof(m), g = c.createGain(), lfo = osc(c, 'sine', 5.1, t, t + len + 0.9), lg = c.createGain(), end = t + len + 0.9;
    lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * 0.007, t + 0.6); lfo.connect(lg);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.085, t + 0.3); g.gain.setValueAtTime(0.085, t + len - 0.05); g.gain.linearRampToValueAtTime(0.0001, t + len + 0.8);
    for (const [type, mult, vol] of [['sine', 1, 1], ['triangle', 1, 0.3], ['sine', 2, 0.15]]) {
      const o = osc(c, type, f * mult, t, end), og = c.createGain(); lg.connect(o.frequency);
      og.gain.value = vol; o.connect(og); og.connect(g);
    }
    g.connect(N.bus); g.connect(N.verbSend); g.connect(N.dlySend);
  }
  function riser(N, t, len) {
    const c = N.c, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = N.noise; s.loop = true; fl.type = 'bandpass'; fl.Q.value = 2;
    fl.frequency.setValueAtTime(300, t); fl.frequency.exponentialRampToValueAtTime(7000, t + len);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.14, t + len); g.gain.linearRampToValueAtTime(0.0001, t + len + 0.05);
    s.connect(fl); fl.connect(g); g.connect(N.bus); g.connect(N.verbSend); s.start(t); s.stop(t + len + 0.1);
  }

  // the song: bar 0-3 intro, 4-11 beat, 12-23 drop, 24-27 breakdown, 28-31 build; then loops from bar 4
  function plan(gbar) {
    const b = gbar < 32 ? gbar : 4 + (gbar - 32) % 28;
    return { b, intro: b < 4, kick: (b >= 4 && b < 24) || b >= 28, bass: b >= 4 && b < 24,
      hat: b < 24 || b >= 28, hat16: b >= 12 && b < 24, clap: (b >= 12 && b < 24) || b >= 30,
      lead: b >= 12 && b < 28, riser: b === 11 || b === 31 };
  }
  function schedStep(N, gbar, s, t) {
    const P = plan(gbar), b = P.b, ch = CHORDS[(b >> 1) & 3];
    if (s === 0 && (b & 1) === 0) pad(N, t, ch.pad, S * 32);
    if (P.kick && s % 4 === 0) kick(N, t);
    if (P.hat && s % 4 === 2) hat(N, t, P.intro ? 0.08 : 0.2, P.hat16 && s === 14);
    if (P.hat16 && s % 2 === 1) hat(N, t, 0.06);
    if (P.clap && (s === 4 || s === 12)) clap(N, t);
    if (P.bass && s % 4 >= 2) bass(N, t, ch.root + (s === 15 ? 12 : 0), S * 0.95, s % 4 === 2 ? 0.7 : 0.35);
    if (s % 2 === 0) pluck(N, t, ch.arp[(b * 8 + (s >> 1)) % ch.arp.length] + 12, P.intro ? 0.06 : P.kick ? 0.08 : 0.1);
    if (P.lead) for (const n of MELODY) if (n[0] === (b & 7) && n[1] === s) ghost(N, t, n[2], n[3] * S);
    if (P.riser && s === 0) riser(N, t, S * 16);
  }

  // ---- live playback ----
  let N = null, on = true, playing = false, timer = 0, nextT = 0, gbar = 0, step = 0, sleepT = 0;
  try { on = localStorage.getItem(KEY) !== 'off'; } catch (e) {}
  function tick() {
    const c = N.c;
    if (nextT < c.currentTime) nextT = c.currentTime + 0.05;          // after a stall, pick up cleanly
    while (nextT < c.currentTime + 0.15) {
      schedStep(N, gbar, step, nextT);
      nextT += S; if (++step === 16) { step = 0; gbar++; }
    }
  }
  function fadeTo(v, secs) {
    const g = N.master.gain, now = N.c.currentTime;
    g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.linearRampToValueAtTime(v, now + secs);
  }
  function start() {
    if (!N || playing) return;
    playing = true; clearTimeout(sleepT);
    const go = () => { if (!playing) return; nextT = N.c.currentTime + 0.06; fadeTo(VOL, 1.6); tick(); clearInterval(timer); timer = setInterval(tick, 25); };
    N.c.state === 'running' ? go() : N.c.resume().then(go, go);
  }
  function stop() {
    if (!N || !playing) return;
    playing = false; fadeTo(0, 0.5);
    clearTimeout(sleepT); sleepT = setTimeout(() => { if (!playing) { clearInterval(timer); N.c.suspend().catch(() => {}); } }, 650);
  }
  function unlock() {
    if (N) { if (on && !playing) start(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) {}   // mix with other audio, follow the silent switch
    let c; try { c = new AC({ latencyHint: 'playback' }); } catch (e) { try { c = new AC(); } catch (e2) { return; } }
    N = build(c, c.destination);
    const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0);   // wakes iOS audio
    if (c.state !== 'running') c.resume().catch(() => {});
    ['pointerdown', 'touchend', 'click', 'keydown'].forEach(e => window.removeEventListener(e, unlock, true));
    if (on) start();
  }
  ['pointerdown', 'touchend', 'click', 'keydown'].forEach(e => window.addEventListener(e, unlock, true));
  document.addEventListener('visibilitychange', () => {
    if (!N) return;
    if (document.hidden) { clearInterval(timer); N.c.suspend().catch(() => {}); }
    else if (playing) N.c.resume().then(() => { nextT = N.c.currentTime + 0.06; clearInterval(timer); timer = setInterval(tick, 25); }, () => {});
  });

  return {
    isOn: () => on,
    set(v) { on = !!v; try { localStorage.setItem(KEY, on ? 'on' : 'off'); } catch (e) {} if (on) { N ? start() : 0; } else stop(); return on; },
    toggle() { return this.set(!on); },
    muffle(v) { if (N) N.tone.frequency.setTargetAtTime(v ? 650 : 18000, N.c.currentTime, 0.12); },
    // render the song offline (used to check the mix; not called by the game)
    _offline(secs, from) {
      const sr = 44100, c = new OfflineAudioContext(2, Math.ceil(sr * secs), sr), M = build(c, c.destination);
      M.master.gain.value = VOL;
      let t = 0.05, gb = from || 0, st = 0;
      while (t < secs) { schedStep(M, gb, st, t); t += S; if (++st === 16) { st = 0; gb++; } }
      return c.startRendering();
    },
  };
})();

const UI=(()=>{
  function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
    document.getElementById(id).classList.add('on');
    if(id!=='title') closeSettings();
    Render.titleShow(id==='title'); Music.muffle(false);}
  function musicLabels(){
    const on=Music.isOn(), r=document.getElementById('musicRow'), p=document.getElementById('pbMusic');
    if(r){ r.setAttribute('aria-checked', on?'true':'false'); r.classList.toggle('off', !on); }
    if(p) p.textContent='Music: '+(on?'on':'off'); }
  function openSettings(){
    const st=document.getElementById('tsStat');
    if(st) st.innerHTML='<b>'+Store.totalStars()+'</b> stars · <b>'+Store.cleared()+'</b> of '+LEVELS.length+' cleared · <b>'+Store.totalScore()+'</b> points';
    document.getElementById('tsMain').hidden=false; document.getElementById('tsConfirm').hidden=true;
    musicLabels(); document.getElementById('tsheet').classList.add('on'); }
  function closeSettings(){ const s=document.getElementById('tsheet'); if(s) s.classList.remove('on'); }
  function toTitle(){go('title');refreshTitle();}
  function play(){ // resume at first unlocked-but-uncleared, else level 1
    let id=1; for(let i=1;i<=LEVELS.length;i++){ if(Store.unlocked(i)&&!Store.bestFor(i)){id=i;break;} if(Store.unlocked(i))id=i; }
    Game.loadLevel(id,false);
  }
  function refreshTitle(){
    const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
    set('ttStars',Store.totalStars()); set('tStars',Store.totalStars());
    set('ttScore',Store.totalScore()); set('tScore',Store.totalScore());
    set('ttDone',Store.cleared()+'/'+LEVELS.length);
    set('tDone',Store.cleared()+'/'+LEVELS.length);
  }
  function starStr(n){let s='';for(let i=1;i<=3;i++)s+=(i<=n?'★':'·');return s;}
  function showSelect(){ buildList(false); refreshTitle(); go('select'); }
  function openViewer(){ showSelect(); }
  function buildList(viewer){
    const list=document.getElementById('levlist'); list.innerHTML='';
    LEVELS.forEach(l=>{
      const locked = !viewer && !Store.unlocked(l.id);
      const st = Store.starsFor(l.id);
      const best = Store.bestFor(l.id);
      const beat = best>0 && best>=(l.refScore||99999);   // beat the verified reference
      const row=document.createElement('div');
      row.className='lrow'+(locked?' lock':'')+(beat?' beat':'');
      const starsHtml = viewer
        ? '<div class="lstars" style="color:var(--sonar)">Test ▶</div>'
        : (locked ? '<div class="lstars"></div>'
                  : '<div class="lstars'+(beat?' hot':'')+'">'+starStr(st)+'</div>');
      const bestHtml = viewer ? 'Reference '+(l.refScore||'?')
                              : (best>0 ? ('Best '+best+(beat?' · beat the reference':'')) : 'Not cleared yet');
      row.innerHTML =
        '<div class="ln">'+l.id+'</div>'+
        '<div class="lmid"><div class="lnm">'+l.name+'</div>'+
        '<div class="lbest">'+(locked?'Locked':bestHtml)+'</div></div>'+
        starsHtml;
      if(!locked) row.onclick=()=>Game.loadLevel(l.id, viewer);
      list.appendChild(row);
    });
  }
  function quitToSelect(){document.getElementById('result').classList.remove('on');
    document.getElementById('pause').classList.remove('on');Game.resumeGame();showSelect();}
  function viewerSolve(){Game.viewerSolve();}
  let tt;
  function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');
    clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2600);}
  return {go,toTitle,play,showSelect,refreshTitle,quitToSelect,openViewer,viewerSolve,toast,
    pause(){
      Game.pause();
      const pb=document.getElementById('pbBest');
      if(pb) pb.classList.toggle('dim', !Game.hasBest());
      document.getElementById('pause').classList.add('on');
      musicLabels(); Music.muffle(true);
    },
    toggleMusic(){ Music.toggle(); musicLabels(); },
    resume(){ document.getElementById('pause').classList.remove('on'); Game.resumeGame(); Music.muffle(false); },
    arrowsDefault(){ Game.arrowsToDefault(); UI.resume(); UI.toast('Echos reset to default'); },
    arrowsBest(){
      if(Game.arrowsToBest()){ UI.resume(); UI.toast('Echos set to your best layout'); }
      else { UI.toast('No best layout saved yet — clear the level first'); }
    },
    toggleFullscreen(){
      const el=document.documentElement;
      const fs=document.fullscreenElement||document.webkitFullscreenElement;
      try{
        const r = !fs ? (el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el)
                      : (document.exitFullscreen||document.webkitExitFullscreen||(()=>{})).call(document);
        if(r && r.catch) r.catch(()=>{});
      }catch(e){}
      // iOS Safari doesn't support element fullscreen; hint the user
      if(!document.fullscreenEnabled && !document.webkitFullscreenEnabled){
        UI.toast('For true fullscreen on iPhone: Share → Add to Home Screen, then open from the icon.');
      }
      setTimeout(resize,120);
    },
    openSettings, closeSettings,
    askReset(){ document.getElementById('tsMain').hidden=true; document.getElementById('tsConfirm').hidden=false; },
    doReset(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} Store.data={stars:{},best:{},unlocked:1}; refreshTitle(); openSettings(); UI.toast('Progress erased'); }};
})();

/* boot */
Store.load(); resize(); UI.refreshTitle();
(function(){
  Render.bdSetStyle('painted');
  const m=/(?:L=|level-)(\d+)/.exec(location.hash);
  if(m && Store.unlocked(+m[1])){ Game.loadLevel(+m[1]); const tip=document.getElementById('tip'); if(tip) tip.classList.remove('on'); }
  else UI.go('title');
})();
// idle render of title-time canvas (dark)
(function idle(){ ctx.clearRect(0,0,VIEW.W,VIEW.H); requestAnimationFrame(()=>{}); })();
